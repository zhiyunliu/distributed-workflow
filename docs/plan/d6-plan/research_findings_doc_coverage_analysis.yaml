# ═══════════════════════════════════════════════════════════════════════════════
# TL;DR 概要
# ═══════════════════════════════════════════════════════════════════════════════
tldr: |
  - D1-D6 六个阶段设计文档全量覆盖项目演进路径（v0.1→v1.0 LTS），共定义 80+ 核心功能模块
  - 现有计划文档仅 d1-plan/plan.yaml（14任务，全部pending）和 d6-plan/plan.yaml（24任务，全部not-started）
  - D2/D3/D4/D5 四个阶段完全没有对应 plan.yaml，是最大的规划缺口
  - d1-plan 对 D1.md 覆盖率约 95%，缺少显式的单元测试覆盖率验证任务
  - d6-plan 对 D6.md 覆盖率约 65%，主要缺失：移动端H5/小程序页面、钉钉/企微消息推送、
    数据加密脱敏合规、国密算法、备份恢复工具、官方内置插件实现、前端可视化大屏页面、
    全量性能优化任务、商业化交付文档任务
  - D1-D6 共提取 52 条量化验收标准，计划文档中显式覆盖约 30 条，未覆盖 22 条

research_metadata:
  methodology: "read_file 并行读取全部 D*.md + architectural-design.md + plan.yaml，逐段比对功能清单与计划任务"
  scope: "docs/D1.md ~ D6.md, docs/architectural-design.md, docs/plan/d1-plan/plan.yaml, docs/plan/d6-plan/plan.yaml, docs/plan/d6-plan/research_findings_d6_readiness.yaml"
  confidence: high
  coverage: 98
  decision_blockers: 3
  research_blockers: 0

# ═══════════════════════════════════════════════════════════════════════════════
# 1. 每个文档核心功能列表
# ═══════════════════════════════════════════════════════════════════════════════
document_summaries:

  D1_核心基础架构:
    doc_ref: "docs/D1.md"
    version_range: "v0.1.0 - v0.4.0"
    dev_weeks: 8
    core_modules:
      - "引擎核心数据结构与接口定义（WorkflowDef/Instance/NodeState/Context/NodeWorkerInfo）"
      - "Engine核心调度服务（WorkflowService/SchedulerService/InstanceStateService/WorkerManagerService）"
      - "NodeWorker分布式执行节点（gRPC服务端/NodeExecutorContainer/任务执行管理）"
      - "Engine↔NodeWorker gRPC通信协议（EngineService/NodeWorkerService）"
      - "Nacos服务注册、发现与健康检查"
      - "SQL Server持久化层（4张核心表：workflow_defs/instances/node_states/instance_context）"
      - "Redis分布式锁（SETNX+Lua+WatchDog）与Redis任务队列（LPUSH/BRPOP）"
      - "基础DAG调度（All全量依赖/Any任意依赖两种模式）"
      - "HTTP触发端点（POST /api/v1/workflow/{id}/start）"
      - "按节点类型粒度并发控制（加权最小负载算法）"
      - "基础错误处理与结构化日志（zerolog，含trace_id/instance_id/node_id）"
      - "自定义节点类型扩展（NodeExecutor接口，无需修改引擎核心）"
    excluded_from_scope:
      - "流程版本管理（D2）"
      - "暂停/恢复/终止/重试（D2）"
      - "子流程（D2）"
      - "人工任务节点/定时端点（D3）"
      - "失败重试/补偿（D2/D3）"
      - "前端界面/可视化（D4）"
      - "可观测性体系（D6）"
      - "多租户/权限控制（D6+）"
    acceptance_criteria:
      - id: "D1-AC-1"
        desc: "可通过Go代码定义WorkflowDef并成功启动执行"
      - id: "D1-AC-2"
        desc: "支持跨机器部署NodeWorker，Engine可自动发现并分配任务"
      - id: "D1-AC-3"
        desc: "完整支持All/Any两种依赖模式的DAG调度"
      - id: "D1-AC-4"
        desc: "所有流程状态持久化到SQL Server，重启后自动恢复未完成任务"
      - id: "D1-AC-5"
        desc: "支持用户实现NodeExecutor接口自定义节点类型，无需修改引擎"
      - id: "D1-AC-6"
        desc: "支持按节点类型为每个NodeWorker设置独立最大并发数"
      - id: "D1-AC-7"
        desc: "核心代码单元测试覆盖率≥80%"
      - id: "D1-AC-8"
        desc: "提供3个以上可直接运行的完整示例（串行/分支/并行）"
      - id: "D1-AC-9"
        desc: "提供完整Go Doc接口文档与开发接入指南"

  D2_流程管理与控制:
    doc_ref: "docs/D2.md"
    version_range: "v0.5.0 - v0.6.0"
    dev_weeks: 4
    prerequisite: "D1 v0.4.0"
    core_modules:
      - "流程定义版本化管理（版本创建/历史查询/回滚/灰度发布/运行实例版本隔离）"
      - "流程实例全生命周期管控（暂停/恢复/手动终止/单节点重试/全流程重试/断点续执行）"
      - "统一错误处理与重试机制（固定间隔/指数退避/重试策略配置/错误分级/死信队列）"
      - "NodeWorker高可用与故障自动转移（实时检测/任务重分配/孤儿清理/网络分区容错）"
      - "子流程调用支持（同步/异步/嵌套/父子上下文传递/生命周期联动）"
      - "流程变更管控（变更仅对新实例生效，运行中实例不受影响）"
    key_types_added:
      - "WorkflowStatusPaused/Cancelled/Retrying（新增状态枚举）"
      - "WorkflowNodeStatusSkipped/Cancelled/Queued（新增节点状态）"
      - "RetryStrategyType（fixed/exponential）"
      - "GrayReleaseType（ratio/whitelist）"
      - "SubflowCallMode（sync/async）"
      - "WorkflowVersion struct（含GrayReleaseConfig）"
      - "RetryPolicy struct"
    acceptance_criteria:
      - id: "D2-AC-1"
        desc: "流程版本最多保留100个历史版本，回滚耗时<100ms，支持按比例/白名单灰度"
