# 5. 开放问题
# ═══════════════════════════════════════════════════════════════════════════════
open_questions:
  - question: "D2/D3/D4/D5是否已有部分代码实现？如何与计划文档对齐？"
    context: "d6-plan的research_findings提到D1-D5已完整实现15张业务表/14个接口/12个前端页面，但无对应plan.yaml追踪"
    type: decision_blocker
    affects: ["plan completeness", "D2-D5 plan creation"]

  - question: "D6-plan/plan.yaml的Wave 6是否还有更多任务（文件被截断）？"
    context: "读取到d6-w6-t1表单引擎前端API封装后，文件内容结束，不确定是否还有更多Wave 6前端页面任务"
    type: decision_blocker
    affects: ["D6-GAP-1", "D6-GAP-3", "D6-GAP-4", "D6-GAP-17"]

  - question: "热插拔插件机制的技术选型是Go plugin包还是独立子进程/IPC方案？"
    context: "D6.md要求插件热插拔无重启，Go plugin包有诸多限制（仅Linux、不可卸载），需明确技术方案"
    type: decision_blocker
    affects: ["D6-GAP-10", "D6-AC-6"]

# ═══════════════════════════════════════════════════════════════════════════════
# 6. 空缺与风险汇总
# ═══════════════════════════════════════════════════════════════════════════════
gaps:
  - area: "D2-D5阶段计划文档完全缺失"
    description: "4个阶段共约50+任务无任何计划追踪，无法确认实现状态和质量"
    impact: decision_blocker
    affects: ["D2-AC-*", "D3-AC-*", "D4-AC-*", "D5-AC-*"]

  - area: "D6前端页面实现缺失"
    description: "表单设计器/BI大屏/插件市场等可视化页面仅有API封装，无UI组件和页面任务"
    impact: decision_blocker
    affects: ["D6-AC-1", "D6-AC-4", "D6-AC-6"]

  - area: "等保2.0合规实现不完整"
    description: "数据加密脱敏/国密算法/备份恢复工具等核心合规要求未在计划中体现"
    impact: decision_blocker
    affects: ["D6-AC-3"]

  - area: "移动端与消息推送能力缺失"
    description: "钉钉/企微适配仅实现OAuth登录，无消息推送/H5/通讯录同步"
    impact: research_blocker
    affects: ["D6-AC-5"]

  - area: "性能优化任务未规划"
    description: "D6目标调度延迟<30ms（较D5<50ms提升40%），但无任何性能优化任务"
    impact: research_blocker
    affects: ["D6-AC-8"]

  - area: "全量测试覆盖率和商业化文档"
    description: "D6目标≥95%覆盖率和完整商业化文档，但计划中无对应任务"
    impact: nice_to_know
    affects: ["D6-AC-9", "D6-AC-10"]
