  - task_id: "d6-w3-t4"
    wave: 3
    title: "实现插件注册管理服务"
    agent: gem-implementer
    status: not-started
    dependencies: ["d6-w2-t4"]
    files:
      - "engine/plugin_service.go"
      - "plugin/registry.go"
    description: |
      1. engine/plugin_service.go：实现PluginService接口
         结构体：pluginService struct { repo interfaces.PluginRepository, registry *plugin.PluginRegistry }
         - ListPluginMarket：查询plugin_info表中的插件（含官方预设）
         - GetPlugin：按pluginID查询
         - InstallPlugin：检查插件存在，写入plugin_config记录（status=1），调用registry.Register
         - ListInstalledPlugins：查询已安装插件
         - EnablePlugin：更新plugin_config.status=2，调用registry.Enable
         - DisablePlugin：更新plugin_config.status=3，调用registry.Disable
         - UninstallPlugin：调用registry.Unregister，删除plugin_config记录，更新plugin_info.status=0
         - UpdatePluginConfig：更新plugin_config.config字段
      2. plugin/registry.go：插件注册中心
         PluginRegistry struct，内部使用sync.RWMutex保护 map[string]Plugin 存储
         - Register(plugin Plugin) error：注册插件，校验ID唯一
         - Unregister(pluginID string) error：注销插件，调用plugin.Destroy()
         - Enable(pluginID string) error
         - Disable(pluginID string) error
