  - task_id: "d6-w3-t5"
    wave: 3
    title: "实现OAuth服务框架"
    agent: gem-implementer
    status: not-started
    dependencies: ["d6-w2-t4"]
    files:
      - "engine/oauth_service.go"
    description: |
      在 engine/ 实现 OAuthService 接口框架（interfaces/oauth_service.go）。
      结构体：oauthService struct { repo interfaces.OAuthRepository, dingtalkCfg *types.DingTalkConfig, wechatWorkCfg *types.WechatWorkConfig }
      注意：钉钉/企业微信SDK调用使用HTTP请求实现，不引入第三方SDK依赖。
      - GetDingTalkAuthURL：构造钉钉OAuth2.0扫码授权URL
        URL格式：https://login.dingtalk.com/oauth2/auth?client_id={appkey}&redirect_uri={redirectURI}&response_type=code&scope=openid&state={state}
      - HandleDingTalkCallback：使用code换取钉钉accessToken，再获取用户信息
        1. POST https://api.dingtalk.com/v1.0/oauth2/userAccessToken (code换token)
        2. GET https://api.dingtalk.com/v1.0/contact/users/me (获取用户信息)
      - GetWechatWorkAuthURL：构造企业微信OAuth2.0授权URL
        URL格式：https://open.weixin.qq.com/connect/oauth2/authorize?appid={corpid}&redirect_uri={redirectURI}&response_type=code&scope=snsapi_base&state={state}#wechat_redirect
      - HandleWechatWorkCallback：使用code换取企业微信用户信息
        GET https://qyapi.weixin.qq.com/cgi-bin/user/getuserinfo?access_token={token}&code={code}
      - BindUser：存储OAuth绑定关系
      - GetBindingByOpenID/GetBindingBySysUser：查询绑定关系
      所有HTTP请求设置超时30s，使用标准net/http.Client，不使用全局client。
      IMPORTANT：钉钉/企业微信appSecret等敏感配置从配置文件读取，禁止硬编码。

