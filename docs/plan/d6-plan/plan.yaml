  - task_id: "d6-w1-t1"
    wave: 1
    title: "新增D6数据库Schema文件"
    agent: gem-implementer
    status: not-started
    dependencies: []
    files:
      - "storage/sqlserver/schema_d6.sql"
    description: |
      创建 storage/sqlserver/schema_d6.sql，包含D6阶段所有新增表：
      1. form_definition (form_id VARCHAR(64) PK, form_name, description, form_schema NVARCHAR(MAX), version INT, status INT, created_by, created_at, updated_at, deleted BIT)
      2. form_instance (instance_id PK, form_id, form_version, workflow_instance_id, node_id, form_data NVARCHAR(MAX), status, created_by, created_at, updated_at)
      3. form_version_history (id BIGINT IDENTITY PK, form_id, version, form_schema, change_log, created_by, created_at; UNIQUE(form_id,version))
      4. approval_delegate (id BIGINT IDENTITY PK, delegator_id, agent_id, start_time, end_time, status INT DEFAULT 1, created_by, created_at, updated_at)
      5. approval_cc (id BIGINT IDENTITY PK, workflow_instance_id, node_id, cc_user_id, cc_time, is_read BIT DEFAULT 0, read_time)
      6. approval_add_sign (id BIGINT IDENTITY PK, workflow_instance_id, node_id, operator_id, sign_type VARCHAR(32), sign_users NVARCHAR(MAX), created_at)
      7. stats_workflow_daily (id BIGINT IDENTITY PK, workflow_id, stat_date DATE, start_count, complete_count, fail_count, avg_execution_time_ms BIGINT, max_execution_time_ms BIGINT, timeout_count, reject_count; UNIQUE(workflow_id, stat_date))
      8. stats_approval_daily (id BIGINT IDENTITY PK, user_id, stat_date DATE, approve_count, reject_count, avg_approval_time_ms BIGINT, timeout_count; UNIQUE(user_id, stat_date))
      9. oauth_bindings (id BIGINT IDENTITY PK, sys_user_id VARCHAR(64), platform VARCHAR(32), open_id VARCHAR(128), union_id VARCHAR(128), nickname, avatar_url, access_token, refresh_token, token_expire_at, created_at, updated_at; UNIQUE(platform, open_id))
      10. plugin_info (plugin_id VARCHAR(64) PK, plugin_name VARCHAR(128) UNIQUE, description, author, version, plugin_type, plugin_package NVARCHAR(MAX), config_schema NVARCHAR(MAX), status INT DEFAULT 0, is_official BIT, download_count INT, rating DECIMAL(2,1), created_at, updated_at)
      11. plugin_config (id BIGINT IDENTITY PK, plugin_id VARCHAR(64) UNIQUE, plugin_version, config NVARCHAR(MAX), status INT DEFAULT 1, installed_at, updated_at)
      以及原有表的索引优化（idx_workflow_instances_workflow_id_status等4个索引）。
      注意：所有注释使用中文，字段加注释说明。

