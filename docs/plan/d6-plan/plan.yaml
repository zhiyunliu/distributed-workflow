  - task_id: "d6-w3-t1"
    wave: 3
    title: "实现表单引擎业务服务"
    agent: gem-implementer
    status: not-started
    dependencies: ["d6-w2-t1"]
    files:
      - "engine/form_service.go"
    description: |
      在 engine/ 实现 FormService 接口（interfaces/form_service.go）。
      结构体：formService struct { repo interfaces.FormRepository }
      - CreateForm：生成UUID作为FormID，version=1，status=0(草稿)，校验FormName不为空
      - GetForm：直接查询，deleted=false
      - UpdateForm：仅草稿状态可修改，更新updated_at
      - ListForms：分页查询，支持status过滤
      - PublishForm：调用repo.PublishForm，自动递增版本号，写入版本历史
      - RollbackForm：调用repo.RollbackForm，创建新版本基于历史版本schema
      - GetFormVersions：查询该表单所有版本历史
      - SaveFormInstance：生成UUID，保存表单实例数据
      - GetFormInstance：查询表单实例
      - GetFormInstanceByWorkflow：按workflow_instance_id和node_id查询
      所有方法显式处理error，不使用panic。

  - task_id: "d6-w3-t2"
    wave: 3
    title: "实现高级审批业务服务"
    agent: gem-implementer
    status: not-started
    dependencies: ["d6-w2-t2"]
    files:
      - "engine/advanced_approval_service.go"
    description: |
      在 engine/ 实现 AdvancedApprovalService 接口（interfaces/approval_service_d6.go）。
      结构体：advancedApprovalService struct { repo interfaces.AdvancedApprovalRepository, instanceStateRepo interfaces.InstanceStateRepository }
      核心实现：
      - AddSign：校验操作人有审批权限，创建加签记录，sign_type(before/after)
        - before加签：在当前审批人审批前，插入新审批任务到队列
        - after加签：当前审批通过后，追加审批任务
      - Transfer：校验操作人，更新节点审批任务的assigned_to为target_user_id，记录转签
      - Return：校验目标节点存在于历史节点中，将实例状态回退到目标节点，重新创建待审批任务
      - Withdraw：仅发起人可撤回，仅待审批状态可撤回，更新实例状态为cancelled，记录操作
      - SetDelegate：校验时间范围合法，委托时间start<end，不允许自我委托，存储委托配置
      - GetDelegates：查询用户的委托配置列表
      - SendCC：创建多条cc记录（每个cc_user_id一条），cc_time=now
      - GetCCList：分页查询当前用户的抄送列表
      - MarkCCRead：更新is_read=1，read_time=now
      所有方法显式处理error，不使用panic。入参校验使用if err := validate(...) 模式。

