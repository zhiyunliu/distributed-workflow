plan_id: d6-plan
objective: >
  深度研究 D1-D5 阶段已实现功能，梳理后端核心接口、前端页面/API、数据库表结构，
  识别 D6 阶段需新增或扩展的关键点，为 D6 实施提供完整基线。
focus_area: d6_readiness
created_at: "2026-04-28"
created_by: RESEARCHER
status: completed

tldr: |
  - D1-D5 已完整实现：流程定义CRUD/版本管理、DAG调度、Worker分发、人工审批、审计日志、
    端点管理（HTTP+定时）、系统用户/角色/菜单/字典、流程模板市场，共 15 张业务表
  - 后端核心接口 14 个（interfaces/ + sysmanager/），Repository 接口 2 个（SQL+Redis）
  - 前端已有 12 个页面、11 个 API 封装文件
  - D6 需全新引入：表单引擎（0 代码基础）、高级审批扩展（6 种新场景）、等保合规层、
    BI 数据分析、钉钉/企业微信适配、Golang 插件化框架
  - 关键架构约束：绝对禁止修改 D1-D5 已发布接口，所有 D6 能力均为增量扩展

research_metadata:
  methodology: "read_file + grep_search + list_dir 三遍扫描，优先核心接口文件，次之 schema/types，最后前端"
  scope: "全量 Go 后端 interfaces/、engine/、storage/、sysmodel/、sysmanager/、types/；前端 web/src/api/ + views/；全部 schema*.sql"
  confidence: high
  coverage: 95
  decision_blockers: 3
  research_blockers: 0

# ═══════════════════════════════════════════════════════════════════════════════
# 1. 后端核心接口清单
# ═══════════════════════════════════════════════════════════════════════════════
files_analyzed:
  - file: interfaces/services.go
    path: interfaces/services.go
    purpose: 所有业务服务接口定义（Engine 面向上层的服务契约）
    key_elements:
      - element: WorkflowService
        type: interface
        location: "interfaces/services.go:11"
        description: >
          工作流定义管理 + 实例生命周期。
          核心方法：CreateWorkflow、GetWorkflow、UpdateWorkflow、DeleteWorkflow、
          StartWorkflow、GetWorkflowInstance、
          D2扩展：GetWorkflowVersion、ListWorkflowVersions、RollbackWorkflow、UpdateGrayConfig、
          PauseInstance、ResumeInstance、CancelInstance、RetryInstance、RetryNode、
          ListWorkflowInstances、ListDeadLetterTasks
        language: go
      - element: SchedulerService
        type: interface
        location: "interfaces/services.go:55"
        description: >
          DAG 调度大脑。
          核心方法：StartExecution、ScheduleNextNodes、HandleNodeCompleted、RecoverUnfinishedInstances、
          D2扩展：PauseExecution、ResumeExecution、CancelExecution、RetryExecution、
          RetrySingleNode、HandleWorkerFailure、ProcessRetryQueue
        language: go
      - element: InstanceStateService
        type: interface
        location: "interfaces/services.go:80"
        description: >
          实例/节点状态持久化。
          核心方法：CreateInstance、UpdateInstanceStatus、CreateNodeState、UpdateNodeState、
          GetNodeState、GetInstanceNodeStates、ReportTaskResult、
          D2扩展：ValidateStateTransition、BatchUpdateNodeStatus、UpdateRetryState、GetFailedNodes、GetAssignedNodesByWorker、
          D3扩展：UpdateNodeApprovalState、GetPendingApprovalTasks、AddApprovalRecord、GetApprovalRecords
        language: go
      - element: WorkerManagerService
        type: interface
        location: "interfaces/services.go:115"
        description: >
          Worker 服务发现 + 负载均衡。
          核心方法：GetOnlineWorkers、GetWorkersByNodeType、SelectBestWorker、AssignTask、
          HandleWorkerOffline、UpdateWorkerLoad、RegisterWorker、UpdateHeartbeat、
          D2扩展：CheckWorkerHealth、GetUnhealthyWorkers、FailoverWorker、CleanupOrphanTasks
        language: go
      - element: HTTPEndpointService
        type: interface
        location: "interfaces/services.go:145"
        description: "HTTP触发端点。方法：Start、Stop、RegisterWorkflowEndpoint"
        language: go
      - element: ApprovalService
        type: interface
        location: "interfaces/services.go:155"
        description: >
          D3 人工审批服务（基础版）。
          方法：Approve、Reject、GetPendingTasks、GetApprovalRecords。
          【D6 需扩展】：AddSign、Transfer、Delegate、Escalate、RollbackTo、Countersign
        language: go
      - element: AuditLogService
        type: interface
        location: "interfaces/services.go:165"
        description: "D3 审计日志服务。方法：Record、QueryLogs、ArchiveLogs"
        language: go
      - element: EndpointManagerService
        type: interface
        location: "interfaces/services.go:175"
        description: >
          D3 端点管理（HTTP+定时）。
          方法：CreateEndpoint、UpdateEndpoint、GetEndpoint、ListEndpoints、StartEndpoint、StopEndpoint、DeleteEndpoint
        language: go

  - file: interfaces/components.go
    path: interfaces/components.go
    purpose: 引擎内部组件接口（执行器、锁、队列、上下文、版本管理等）
    key_elements:
      - element: NodeExecutor
        type: interface
        location: "interfaces/components.go:11"
        description: "节点执行器基础接口。方法：Type() string、Execute(config,input,ctx)"
        language: go
      - element: NodeExecutorContainer
        type: interface
        location: "interfaces/components.go:25"
        description: "执行器容器。方法：Register、Get、List"
        language: go
      - element: TaskExecutionManager
        type: interface
        location: "interfaces/components.go:35"
        description: "任务执行管理。方法：Submit、Cancel、GetCurrentLoad"
        language: go
      - element: DistributedLock
        type: interface
        location: "interfaces/components.go:44"
        description: "分布式锁。方法：Lock、Unlock、TryLockWithTimeout"
        language: go
      - element: ContextManager
        type: interface
        location: "interfaces/components.go:60"
        description: "流程上下文管理。方法：CreateContext、GetContext、UpdateContext、DeleteContext、SaveSnapshot、RestoreSnapshot"
        language: go
      - element: ErrorHandler
        type: interface
        location: "interfaces/components.go:80"
        description: "错误处理+死信队列。方法：HandleError、MoveToDeadLetter、ResendDeadLetterTask、ListDeadLetterTasks"
        language: go
      - element: WorkflowVersionManager
        type: interface
        location: "interfaces/components.go:95"
        description: "D2 版本管理。方法：CreateVersion、GetVersion、GetCurrentVersion、ListVersions、SetCurrentVersion、SelectVersionForInstance"
        language: go
      - element: LifecycleManager
        type: interface
        location: "interfaces/components.go:108"
        description: "D2 生命周期管理。方法：Pause、Resume、Cancel、Retry、RetryNode"
        language: go
      - element: SubflowManager
        type: interface
        location: "interfaces/components.go:118"
        description: "D2 子流程管理。方法：TriggerSubflow、OnSubflowComplete、GetSubflowDepth"
        language: go
      - element: FailoverManager
        type: interface
        location: "interfaces/components.go:128"
        description: "D2 Worker故障转移。方法：StartHealthCheckLoop、StopHealthCheckLoop、HealthCheckWorker、FailoverWorker"
        language: go
      - element: AuditLogManager
        type: interface
        location: "interfaces/components.go:140"
        description: "D3 审计日志异步写管理器。方法：RecordLog、BatchRecordLog、QueryLogs、GetLogByID、ArchiveLogs、Start、Stop"
        language: go
      - element: CallbackManager
        type: interface
        location: "interfaces/components.go:155"
        description: "D3 节点回调管理器。方法：InvokeCallback、InvokeWebhook"
        language: go

  - file: interfaces/repository.go
    path: interfaces/repository.go
    purpose: 数据持久化接口（SQL Server + Redis）
    key_elements:
      - element: WorkflowRepository
        type: interface
        location: "interfaces/repository.go:11"
        description: >
          SQL Server 持久化全量接口，涵盖：
          D1：工作流定义CRUD、实例CRUD、节点状态CRUD、上下文CRUD
          D2：版本管理、死信队列
          D3：审计日志、审批记录、端点管理
          D5：流程模板（CreateWorkflowTemplate、UpdateWorkflowTemplate、GetWorkflowTemplate、
              ListWorkflowTemplates、PublishWorkflowTemplate、IncrementWorkflowTemplateInstallCount、ListWorkflowTemplateCategories）
        language: go
      - element: RedisRepository
        type: interface
        location: "interfaces/repository.go:155"
        description: "Redis操作接口：分布式锁(Lock/Unlock/RenewLock)、任务队列(EnqueueTask/DequeueTask/GetQueueLength)、缓存(SetCache/GetCache/DeleteCache)"
        language: go

  - file: sysmanager/interfaces.go
    path: sysmanager/interfaces.go
    purpose: "D4 系统管理抽象层接口（用户/角色/菜单/认证/权限）"
    key_elements:
      - element: UserService
        type: interface
        location: "sysmanager/interfaces.go:15"
        description: >
          用户服务：GetUserByID、GetUserByUsername、ListUsers、CreateUser、UpdateUser、
          DeleteUser、GetUserRoles、GetUserPermissions、ResetPassword、AssignRoles
        language: go
      - element: RoleService
        type: interface
        location: "sysmanager/interfaces.go:35"
        description: >
          角色服务：GetRoleByID、GetRoleByCode、ListRoles、CreateRole、UpdateRole、
          DeleteRole、GetRoleMenus、AssignRoleMenus
        language: go
      - element: MenuService
        type: interface
        location: "sysmanager/interfaces.go:55"
        description: >
          菜单服务：GetMenuByID、ListMenus、GetMenuTree、GetUserMenuTree、
          CreateMenu、UpdateMenu、DeleteMenu
        language: go
      - element: AuthService
        type: interface
        location: "sysmanager/interfaces.go:70"
        description: >
          认证服务：Login、Logout、ValidateToken、RefreshToken、ChangePassword。
          【D6 需扩展】：MFAVerify、MFASetup、OAuthCallback（钉钉/企微）
        language: go
      - element: PermissionService
        type: interface
        location: "sysmanager/interfaces.go:85"
        description: "权限校验：HasPermission、HasAnyPermission、HasAllPermissions、HasRole、HasAnyRole、CheckDataScope"
        language: go

  - file: types/types.go
    path: types/types.go
    purpose: 全量业务类型定义（D1-D5 共 25+ 结构体）
    key_elements:
      - element: WorkflowDef
        type: class
        location: "types/types.go:180"
        description: "流程定义。含 Nodes、Connections、StartNodeID、EndNodeID、GlobalRetryPolicy(D2)、Timeout(D2)"
        language: go
      - element: WorkflowNode
        type: class
        location: "types/types.go:215"
        description: "节点定义。含 HumanTaskConfig(D3)、CallbackConfig(D3)、SubflowConfig(D2)、RetryPolicy(D2)"
        language: go
      - element: WorkflowInstance
        type: class
        location: "types/types.go:290"
        description: "流程实例。含 PauseTime/CancelTime/ParentInstanceID(D2)等运行时字段"
        language: go
      - element: WorkflowNodeState
        type: class
        location: "types/types.go:330"
        description: "节点状态。含 ApprovalStatus/CurrentApproverIndex/ApprovalRecords(D3)"
        language: go
      - element: HumanTaskConfig
        type: class
        location: "types/types.go:540"
        description: >
          D3 人工任务配置。含 ApprovalMode(single/or_sign/sequential)、Approvers、
          TimeoutAction(pass/reject/skip)、RejectAction(terminate/goto)、FormFields。
          【D6 需扩展】：AddSignConfig、TransferConfig、DelegateConfig、EscalateConfig
        language: go
      - element: WorkflowTemplate
        type: class
        location: "types/types.go:670"
        description: "D5 流程模板。含 Status(draft/published/offline)、VisibleScope、InstallCount、StartCount"
        language: go

  - file: sysmodel/types.go
    path: sysmodel/types.go
    purpose: "D4 系统管理数据模型"
    key_elements:
      - element: SystemUser
        type: class
        location: "sysmodel/types.go:12"
        description: "系统用户。含 ID/Username/Password/RealName/Email/Phone/Avatar/Status/DeptID"
        language: go
      - element: SystemRole
        type: class
        location: "sysmodel/types.go:35"
        description: "系统角色。含 RoleName/RoleCode/DataScope(全量/本部门/个人)"
        language: go
      - element: SystemMenu
        type: class
        location: "sysmodel/types.go:55"
        description: "系统菜单树。MenuType(M=目录/C=菜单/F=按钮)"
        language: go
      - element: LoginRequest/LoginResponse
        type: class
        location: "sysmodel/types.go:80"
        description: "认证请求/响应。含 GrantType 支持 password/authorization_code/client_credentials"
        language: go
      - element: DictionaryItem
        type: class
        location: "sysmodel/types.go:110"
        description: "数据字典项。含 DictType/DictName/DictValue/DictGroup"
        language: go
      - element: AuthConfig
        type: class
        location: "sysmodel/types.go:130"
        description: "认证配置。Type(builtin/ldap/oauth2/custom)、Secret、ExpireHours"
        language: go

  - file: engine/approval_service.go
    path: engine/approval_service.go
    purpose: ApprovalService 的 engine 层实现
    key_elements:
      - element: approvalServiceImpl
        type: class
        location: "engine/approval_service.go:15"
        description: >
          依赖：WorkflowRepository、InstanceStateService、AuditLogManager、callbackManagerImpl、SchedulerService（延迟注入解决循环依赖）。
          实现了 Approve/Reject/GetPendingTasks/GetApprovalRecords。
          handleApproval 内部完整实现了 or_sign（任意驳回/全部驳回判定）、sequential（顺序推进）、single 三种审批模式。
          审批通过后调用 sched.HandleNodeCompleted 推进流程。
        language: go
    lines: 250

