      1. deploy/k8s/deployment.yaml：
         - Engine Deployment：replicas=3，image=ghcr.io/zhiyunliu/distributed-workflow:v0.9.0
         - 环境变量通过 configmap/secret 注入（JWT_SECRET/DB_DSN/REDIS_ADDR/NACOS_ADDR）
         - livenessProbe: GET /health 200
         - readinessProbe: GET /ready 200
         - resources: requests cpu=100m/memory=128Mi, limits cpu=500m/memory=512Mi
         - podAntiAffinity：同一节点最多运行 1 个 Engine Pod
      2. deploy/k8s/service.yaml：
         - ClusterIP Service 暴露 Engine API 端口 8080
         - Headless Service 用于 Engine 节点间 gRPC 通信
      3. deploy/k8s/configmap.yaml：
         - 非敏感配置（LOG_LEVEL/DATA_RETENTION_DAYS/ARCHIVE_CRON/OTEL_EXPORTER_ENDPOINT）
         - 使用 Secret 存储 JWT_SECRET/DB_PASSWORD/REDIS_PASSWORD
      4. docker-compose.yml 更新（已有文件扩展）：
         - 新增 prometheus service（镜像 prom/prometheus:latest，挂载 prometheus.yml）
         - 新增 grafana service（镜像 grafana/grafana:latest，端口 3000）
         - 新增 jaeger service（镜像 jaegertracing/all-in-one，端口 16686/14268）
