# ============================================================
# 新目录结构
# ============================================================
new_directories:
  runtime_execution:
    path: runtime-execution/
    structure:
      - cmd/engine/main.go          # 引擎服务入口
      - cmd/worker/main.go          # Worker服务入口
      - internal/common/dag/        # 来自 dag/
      - internal/common/jwtutil/    # 来自 jwtutil/
      - internal/common/plugin/     # 来自 plugin/
      - internal/common/registry/   # 来自 registry/
      - internal/common/rpc/        # 来自 rpc/
      - internal/common/types/      # 来自 types/
      - internal/engine/            # 来自 engine/
      - internal/proto/             # 来自 proto/ (仅.pb.go文件)
      - internal/storage/redis/     # 来自 storage/redis/
      - internal/storage/sqlserver/ # 来自 storage/sqlserver/
      - internal/worker/            # 来自 worker/
      - pkg/api/                    # 来自 interfaces/
      - pkg/endpoint/http/          # 来自 endpoint/http/ (仅d3及通用部分)
      - pkg/endpoint/schedule/      # 来自 endpoint/schedule/
      - pkg/node/                   # 来自 worker/executors/
    go_mod: "无独立go.mod，使用根级 go.mod"

  config_management:
    path: config-management/
    structure:
      - backend/cmd/api/main.go                    # 配置管理API入口
      - backend/internal/dao/repository.go         # 来自 syssqlserver/
      - backend/internal/handler/server*.go        # 来自 endpoint/http/server_d4-d6*.go
      - backend/internal/service/                  # 来自 sysbuiltin/
      - backend/internal/sysmanager/               # 来自 sysmanager/
      - backend/internal/sysmodel/                 # 来自 sysmodel/
      - backend/internal/sysrepo/                  # 来自 sysrepo/
      - frontend/                                  # 来自 web/（文件名完全相同）
    go_mod: "无独立go.mod，使用根级 go.mod"

