  - id: "t3-startup-verification"
    title: "四组件最小启动验证"
    description: |
      目标：完成四组件 L2 启动通过（可持续运行）。

      执行步骤（PowerShell 主口径，可直接执行）：
      1) 端口预检（防冲突）：
        $ports = 5173,8080,8081,50051,50052
        foreach ($p in $ports) { if (Get-NetTCPConnection -LocalPort $p -State Listen -ErrorAction SilentlyContinue) { throw "端口占用: $p" } }
      2) frontend（新终端）：
        Set-Location config-management/frontend; pnpm dev --host 0.0.0.0 --port 5173
      3) backend（新终端，HTTP_ADDR 必填且固定）：
        Set-Location config-management/backend; $env:DB_DSN='...'; $env:JWT_SECRET='...'; $env:HTTP_ADDR=':8080'; go run ./cmd/api
      4) engine（新终端）：
        Set-Location runtime-execution; $env:DB_DSN='...'; $env:REDIS_ADDR='localhost:6379'; $env:GRPC_ADDR=':50051'; $env:HTTP_ADDR=':8081'; go run ./cmd/engine
      5) worker（新终端）：
        Set-Location runtime-execution; $env:ENGINE_ADDR='localhost:50051'; $env:GRPC_ADDR=':50052'; go run ./cmd/worker
      6) 健康检查与监听检查（主路径统一 /api/v1/health）：
        Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/api/v1/health
        Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8081/api/v1/health
        Get-NetTCPConnection -State Listen | Where-Object { $_.LocalPort -in 5173,8080,8081,50051,50052 } | Select-Object LocalAddress,LocalPort,OwningProcess | Format-Table -AutoSize
      7) 60 秒稳定性判定（执行于第 0 秒与第 60 秒）：
        $pidSnapshot1 = Get-Process -Name node,api,engine,worker -ErrorAction SilentlyContinue | Select-Object Name,Id,StartTime
        Start-Sleep -Seconds 60
        $pidSnapshot2 = Get-Process -Name node,api,engine,worker -ErrorAction SilentlyContinue | Select-Object Name,Id,StartTime
        Compare-Object $pidSnapshot1 $pidSnapshot2 -Property Name,Id,StartTime
      8) 日志判定（最近 200 行不得包含 fatal/panic）：
        docker compose logs --tail=200 backend engine worker | Select-String -Pattern "fatal|panic" -CaseSensitive:$false

      等价命令：
      - bash: ss -ltn '( sport = :5173 or sport = :8080 or sport = :8081 or sport = :50051 or sport = :50052 )'; curl -fsS http://127.0.0.1:8080/api/v1/health; curl -fsS http://127.0.0.1:8081/api/v1/health
      - cmd: netstat -ano | findstr ":5173 :8080 :8081 :50051 :50052" && curl http://127.0.0.1:8080/api/v1/health && curl http://127.0.0.1:8081/api/v1/health

      通过标准：
      - 四个进程启动后 60 秒内不退出；
      - 目标端口全部监听成功；
      - backend/engine 的 /api/v1/health 返回成功；
      - 日志无 fatal/panic。

      回退策略：
      - backend/engine 因依赖不可达失败时，回到 wave1 复核依赖；
      - worker 注册失败时，先核对 ENGINE_ADDR 与 gRPC 端口连通；
      - health 路径不一致时，优先修订计划和编排探针到 /api/v1/health；仅在必要时进入 wave4 最小改码。
    wave: 3
    agent: "gem-devops"
