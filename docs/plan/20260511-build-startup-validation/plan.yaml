  - id: "t5-regression-acceptance"
    title: "双轮回归验收与交付归档"
    description: |
      目标：完成最终 L1+L2 双轮回归，形成可交付证据。

      执行步骤（PowerShell 主口径，可直接执行）：
      1) 重新执行 wave2 四组件编译命令
      2) 重新执行 wave3 四组件启动命令、端口预检与 /api/v1/health 探针核验
      3) 可选执行 compose 联动回归：
         docker compose up -d --build && docker compose ps
      4) 执行 60 秒稳定性判定与日志判定：
        $start=Get-Date; Start-Sleep -Seconds 60; $end=Get-Date
        Get-NetTCPConnection -State Listen | Where-Object { $_.LocalPort -in 5173,8080,8081,50051,50052 }
        docker compose logs --since ($start.ToString('o')) --until ($end.ToString('o')) backend engine worker | Select-String -Pattern "fatal|panic" -CaseSensitive:$false
      5) 产出验收记录（证据模板）：
        - 环境信息：日期、分支、提交、操作者
        - 命令证据：完整 PowerShell 命令与退出码
        - 端口证据：5173/8080/8081/50051/50052 监听截图或文本
        - 探针证据：/api/v1/health 响应摘要（backend/engine）
        - 稳定性证据：60 秒前后 PID/进程状态对比
        - 日志证据：60 秒窗口日志检索结果（fatal/panic=0）
        - 异常与回退：问题、处置、最终结论

      通过标准：
      - 两轮结果一致，且无新增阻断；
      - frontend/backend/engine/worker 同时满足 L1+L2；
      - 形成可复用的启动执行说明。

      回退策略：
      - 回归失败时按失败类型回退到 t4 再修复；
      - 若仅环境抖动导致失败，允许受控重试一次，仍失败则标记 blocked。
