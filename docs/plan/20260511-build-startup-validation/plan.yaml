tasks:
  - id: "t1-dependency-gate"
    title: "依赖就绪门禁与变量基线"
    description: |
      目标：在编译/启动前固定可用依赖与变量，避免无效失败。

      执行步骤（PowerShell 主口径，可直接执行）：
      1) docker compose up -d sqlserver redis
      2) docker compose ps
      3) docker compose logs --tail=120 sqlserver redis
      4) 依赖联通性检查（PowerShell）：
        Test-NetConnection -ComputerName localhost -Port 1433
        Test-NetConnection -ComputerName localhost -Port 6379
      5) 输出最小变量矩阵（t1 门禁必含）：
        - backend: DB_DSN, JWT_SECRET, HTTP_ADDR(必填=:8080)
        - engine: DB_DSN, REDIS_ADDR, GRPC_ADDR(建议=:50051), HTTP_ADDR(建议=:8081)
         - worker: ENGINE_ADDR, WORKER_ID(可选), WORKER_IP(可选), GRPC_ADDR(可选)
        - 全局敏感变量门禁: MSSQL_SA_PASSWORD, REDIS_PASSWORD, JWT_SECRET, DB_DSN
         - frontend: Node + pnpm 可执行

      等价命令：
      - bash: docker compose up -d sqlserver redis; docker compose ps; docker compose logs --tail=120 sqlserver redis; nc -z 127.0.0.1 1433; nc -z 127.0.0.1 6379
      - cmd: docker compose up -d sqlserver redis && docker compose ps && docker compose logs --tail=120 sqlserver redis && powershell -Command "Test-NetConnection localhost -Port 1433" && powershell -Command "Test-NetConnection localhost -Port 6379"

      通过标准：
      - sqlserver/redis 为 running 或 healthy；
      - 四组件必填变量完整，无缺失项，且 MSSQL_SA_PASSWORD/REDIS_PASSWORD/JWT_SECRET/DB_DSN 已设置；
      - 依赖与变量清单可被后续 wave 直接复用。

      回退策略：
      - compose 拉起失败时，切换外部 SQL Server/Redis，并同步更新连接串；
      - 健康检查误判时，改用端口监听+主动连接测试作为临时门禁。
    wave: 1
    agent: "gem-devops"
    prototype: false
    covers: ["dependency", "env", "gate"]
    priority: "high"
    status: "pending"
    flags:
      flaky: false
      retries_used: 0
    dependencies: []
    conflicts_with: []
    context_files:
      - path: "docker-compose.yml"
        description: "依赖服务定义与健康检查"
