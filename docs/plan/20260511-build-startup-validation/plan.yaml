tldr: |
  该计划按 DAG 拆分为 5 个波次：依赖就绪 -> 编译验证 -> 启动验证 -> 阻断修复 -> 回归验收。
  目标是让 frontend/backend/engine/worker 在本地开发环境达到可重复的 L1(编译通过)+L2(启动通过)标准。
  启动验收命令以 PowerShell 为主口径，附 bash/cmd 等价写法；健康检查路径统一采用 /api/v1/health（计划与编排口径先统一，非必要不改代码）。
