open_questions:
  - question: "“backend”在验收中是否仅指 config-management/backend/cmd/api，还是包含根目录 Dockerfile 对应服务？"
    context: "Dockerfile 指向 ./cmd/server/main.go，但该文件在仓库不存在；Makefile 构建入口为 ./config-management/backend/cmd/api/"
    type: "decision_blocker"
    affects: ["L1 build", "L2 startup", "部署镜像一致性"]
  - question: "engine 的 Redis 密码参数在代码入口未显式暴露（仅 REDIS_ADDR），是否约定无鉴权 Redis 或通过地址串携带认证信息？"
    context: "docker-compose 配置了 REDIS_PASSWORD，但 engine main 只读取 REDIS_ADDR"
    type: "research"
    affects: ["环境变量最小集合定义", "容器化部署兼容性"]
  - question: "worker 对 ENGINE_ADDR 的可达性是否要求在启动时强一致（注册失败即退出）还是允许延迟注册重试？"
    context: "当前实现注册失败即返回错误并由主程序 Fatal 退出"
    type: "research"
    affects: ["启动稳定性策略", "编排重启策略"]
