plan_id: "20260511-build-startup-validation"
objective: "识别 backend/engine/worker 启动最小环境变量、数据库/Redis 必需性、常见失败点与自动化修复机制（已实现）"
focus_area: "backend-engine-worker-startup-validation"
created_at: "2026-05-11"
created_by: "GitHub Copilot (GPT-5.3-Codex)"
status: "completed"
tldr: |
  - engine 启动硬依赖 DB_DSN 与可达的 SQL Server、Redis（REDIS_ADDR 可默认但 Redis 连通性为启动前置）。
  - worker 启动仅硬依赖 ENGINE_ADDR；无 DB/Redis 直连初始化路径。
  - config-management backend 启动硬依赖 DB_DSN 与 JWT_SECRET；不在启动阶段强制 Redis。
  - 已存在多处“自动恢复/降级”机制：未完成实例恢复、worker 健康检查与故障转移、前端静态资源缺失时后端 API 仍可启动。
  - 发现镜像入口与仓库结构不一致（Dockerfile 指向 ./cmd/server/main.go，文件不存在），属于启动验证阻断风险。
