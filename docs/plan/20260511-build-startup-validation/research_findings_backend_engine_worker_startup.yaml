        location: "runtime-execution/internal/worker/worker.go:83"
        snippet: "if err := w.engineRPC.RegisterWorker(...); err != nil { ... }"
    prevalence: "common"
  - category: "error_handling"
    pattern: "阻断错误与非阻断错误分层"
    description: "监听失败、核心依赖连接失败为阻断；恢复/调度管理失败仅记录日志"
    examples:
      - file: "runtime-execution/internal/engine/engine.go"
        location: "runtime-execution/internal/engine/engine.go:231"
        snippet: "net.Listen 失败直接 return error"
      - file: "runtime-execution/internal/engine/engine.go"
        location: "runtime-execution/internal/engine/engine.go:241"
        snippet: "StartScheduleManager 失败仅 log.Error"
      - file: "runtime-execution/internal/engine/engine.go"
        location: "runtime-execution/internal/engine/engine.go:246"
        snippet: "RecoverUnfinishedInstances 失败仅 log.Error"
    prevalence: "common"
  - category: "architecture"
    pattern: "自动恢复/自愈机制内建"
    description: "引擎恢复未完成实例 + worker 健康检查阈值转离线 + failover 重新派发"
    examples:
      - file: "runtime-execution/internal/engine/scheduler.go"
        location: "runtime-execution/internal/engine/scheduler.go:252"
        snippet: "RecoverUnfinishedInstances"
      - file: "runtime-execution/internal/engine/failover_manager.go"
        location: "runtime-execution/internal/engine/failover_manager.go:18"
        snippet: "offlineThreshold = 5"
      - file: "runtime-execution/internal/engine/failover_manager.go"
        location: "runtime-execution/internal/engine/failover_manager.go:141"
        snippet: "FailoverWorker + SetNX lock"
    prevalence: "occasional"
  - category: "testing"
    pattern: "编排层依赖就绪门控"
    description: "docker-compose 用 healthcheck + depends_on(service_healthy) 实现启动顺序控制"
    examples:
      - file: "docker-compose.yml"
        location: "docker-compose.yml:52"
