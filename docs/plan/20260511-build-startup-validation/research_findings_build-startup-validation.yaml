patterns_found:
  - category: structure
    pattern: "构建与运行入口分散在 Makefile、compose、main.go、package.json"
    description: "统一构建存在（make build-all），统一启动主要依赖 compose，源码级入口由各 main.go 显式声明"
    examples:
      - file: "Makefile"
        location: "Makefile:17"
        snippet: "build-all: build-frontend build-backend"
      - file: "docker-compose.yml"
        location: "docker-compose.yml:3"
        snippet: "services: sqlserver/redis/backend/frontend"
      - file: "runtime-execution/cmd/engine/main.go"
        location: "runtime-execution/cmd/engine/main.go:22"
        snippet: "func main() { ... }"
    prevalence: common
  - category: architecture
    pattern: "依赖驱动启动顺序通过 compose depends_on + healthcheck 固化"
    description: "backend 等待 sqlserver/redis healthy，frontend 等待 backend healthy"
    examples:
      - file: "docker-compose.yml"
        location: "docker-compose.yml:54"
        snippet: "condition: service_healthy"
    prevalence: common
  - category: error_handling
    pattern: "启动阶段环境变量缺失即 fatal 退出"
    description: "backend/engine/worker 在 envOrFatal 中统一强制检查关键变量"
    examples:
