plan_id: "20260511-build-startup-validation"
objective: "核验一键构建/启动入口、frontend/backend/engine/worker实际启动命令与健康检查命令"
focus_area: "build_startup_and_healthcheck"
created_at: "2026-05-11T00:00:00+08:00"
created_by: "gem-researcher"
status: completed
tldr: |
  - Makefile 提供一键构建目标 `build-all`，但未提供一键启动目标。
  - docker-compose.yml 已具备多服务统一启动与服务级 healthcheck，README 未提供统一启动流程。
  - frontend/backend/engine/worker 的入口文件均明确，local 启动命令可由入口路径直接映射为 `go run`/`npm run dev`。
  - 健康检查存在实现-编排不一致：compose/Dockerfile 使用 `/api/v1/health`，但 backend 与 runtime-execution HTTP 路由未检索到该路径。
  - 依赖约束下的顺序链路为：sqlserver+redis -> backend -> frontend；engine/worker 为独立运行链路（worker 依赖 engine gRPC）。
research_metadata:
  methodology: "semantic_search + grep_search + read_file + 入口关系发现"
  scope: "Makefile/README/docker-compose + frontend/backend/engine/worker 启动与健康检查"
  confidence: high
  coverage: 93
  decision_blockers: 1
  research_blockers: 1
