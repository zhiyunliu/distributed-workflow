  - id: T-09-lock-redis
    title: 实现 lock/redis/ Redis 分布式锁
    description: |
      在 lock/redis/ 包实现 DistributedLock 接口：
      1. RedisLock 结构体（key/value/ttl/client/renewCtx/renewCancel），依赖 interfaces.RedisRepository。
      2. Lock()：SET key value NX PX ttl（原子加锁）。
      3. Unlock()：Lua 脚本校验 value 后 DEL（原子释放），防止误释放。
      4. TryLockWithTimeout(timeout)：轮询加锁，每 100ms 重试，直到超时。
      5. WatchDog（自动续期）：Lock 成功后启动 goroutine，每 10 秒检测锁存在则续期至 30 秒。
         Unlock 或 Context 取消时停止续期。
      6. NewRedisLock(repo interfaces.RedisRepository, key, value string, ttl time.Duration) interfaces.DistributedLock 工厂函数。
