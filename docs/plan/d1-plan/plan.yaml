  - id: T-12-worker
    title: 实现 worker/ NodeWorker 主体
    description: |
      在 worker/ 包实现完整的 NodeWorker，包含 6 个子模块：
      1. Worker 启动与注册：
         - 生成 WorkerID（worker-{ip}-{pid}-{uuid}）
         - 解析本地 IP，记录 workerIP
         - 启动 gRPC 服务（默认 9001 端口）
         - 向 NacosRegistry 注册，注册失败重试 3 次
         - 注册 os.Signal 关闭钩子，进程退出时注销
      2. NodeExecutorContainer：
         - sync.Map 存储执行器
         - Register：校验类型唯一性
         - Get/List：线程安全查询
         - 内置 log/http/sleep 三种执行器（log 打印日志，http 发 HTTP 请求，sleep 延时）
      3. TaskExecutionManager：
         - 按节点类型维护 semaphore（channel 实现），控制最大并发数
         - Submit：获取信号量 → 启动 goroutine → context.WithTimeout 超时控制 → 执行 → 上报结果 → 释放信号量
         - Cancel：关闭对应 context 取消执行
         - GetCurrentLoad：返回各类型当前执行数
      4. gRPC 服务端：
         - 实现 NodeWorkerService（AssignTask/CancelTask）
         - 请求日志 + panic recovery interceptor
      5. 心跳上报：
         - 每 5 秒通过 rpc.EngineClient 发送 Heartbeat（含当前负载）
         - 失败重试 3 次，连续失败停止接收新任务
      6. 错误上报：
         - 捕获 panic，转为 error 通过 rpc.EngineClient.ReportError 上报
         - zerolog 记录本地日志
      提供 NodeWorker.Start/Stop/Register 三个公开方法。
      提供单元测试覆盖：执行器注册/获取、并发控制（信号量）、任务超时控制。
