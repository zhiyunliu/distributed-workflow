plan_id: d1-plan
objective: |
  实现 DistributedWorkflow 分布式工作流引擎 D1 阶段核心基础架构，
  完成「流程定义→实例创建→DAG调度→分布式执行→状态持久化」全链路闭环，
  交付最小可用、可分布式部署、可扩展的工作流引擎核心。
created_at: "2026-04-27T00:00:00+08:00"
created_by: gem-planner
status: pending
research_confidence: high

plan_metrics:
  wave_1_task_count: 3
  total_dependencies: 22
  risk_score: medium

tldr: |
  D1 阶段分 6 个 Wave 顺序推进，Wave 1 并行完成脚手架、核心类型和 Proto 定义；
  Wave 2 在类型基础上并行完成接口层、DAG 解析器和 gRPC 生成代码；
  Wave 3 并行实现四个基础设施适配层（SQL Server / Redis 队列 / Redis 锁 / Nacos）；
  Wave 4 并行实现 Engine 五大服务和 NodeWorker 主体；
  Wave 5 完成 HTTP 端点和三个可运行示例；
  Wave 6 完成 Go Doc 与接入指南文档。
  全程遵循接口抽象原则，禁止直接硬编码基础设施依赖。

open_questions:
  - glue 框架版本及其 DI / 配置加载的具体 API，需查阅 github.com/zhiyunliu/glue 文档
  - Nacos Go SDK 版本（nacos-sdk-go v2 还是 v1）确认
  - go-redis 版本（v8 or v9），D1.md 中明确为 v9
  - SQL Server 驱动：microsoft/go-mssqldb 还是 denisenkom/go-mssqldb
  - HTTP 框架：D1.md 中写 Gin，需确认项目是否通过 glue 封装 HTTP 路由

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: gRPC 生成代码依赖 protoc 工具链，CI 环境未安装则生成失败
      likelihood: medium
      impact: high
      mitigation: 将生成的 pb.go 文件直接提交到仓库，同时在 Makefile 提供 generate 目标；实现者在本地运行生成后提交
    - scenario: SQL Server 在开发环境不可用，存储层单元测试无法执行
      likelihood: medium
      impact: medium
      mitigation: storage/sqlserver 层提供基于接口的 Mock 实现；集成测试使用 testcontainers 或跳过标签
    - scenario: Engine 五大服务同属一个大任务，实现者单次 session 内代码量超出上限
      likelihood: high
      impact: medium
      mitigation: Engine 任务按服务边界垂直拆分为 T-11a/T-11b 两个子任务，各自覆盖不超过 3 个文件
    - scenario: Nacos SDK 与 glue 框架集成方式不明确，导致注册发现逻辑反复返工
      likelihood: medium
      impact: medium
      mitigation: 在 T-10-registry-nacos 前先阅读 glue 框架 registry 扩展点文档，确认集成模式后再实现
  assumptions:
    - Go 1.22+ 已安装，开发环境已配置 GOPATH/GOMODULE
    - protoc + protoc-gen-go + protoc-gen-go-grpc 已安装（或 CI 中可用）
    - Redis 6+ 和 SQL Server 2019+ 在本地或测试环境可访问
    - Nacos 2.x 服务在测试环境可访问
    - 使用 go-redis v9、nacos-sdk-go v2、microsoft/go-mssqldb 驱动
    - HTTP 框架使用 github.com/gin-gonic/gin，不通过 glue 路由封装（D1 阶段）
    - zerolog 用于所有日志输出，日志级别通过配置文件控制

implementation_specification:
  code_structure: |
    项目根目录采用平铺式 Go module 结构：
    distributed-workflow/
    ├── go.mod / go.sum
    ├── types/          # 核心枚举与业务结构体，零外部依赖
    ├── interfaces/     # 所有服务接口定义，仅依赖 types/
    ├── proto/          # .proto 文件 + 生成的 pb.go / grpc.pb.go
    ├── rpc/            # gRPC 客户端封装（EngineClient / WorkerClient）
    ├── dag/            # DAG 解析器与依赖检查算法
    ├── storage/
    │   └── sqlserver/  # WorkflowRepository SQL Server 实现
    ├── queue/
    │   └── redis/      # TaskQueueManager Redis 实现
    ├── lock/
    │   └── redis/      # DistributedLock Redis 实现
    ├── registry/
    │   └── nacos/      # Nacos 服务注册发现
    ├── engine/         # Engine 五大服务实现
    ├── worker/         # NodeWorker 主体
    ├── endpoint/
    │   └── http/       # HTTP 触发端点
    └── examples/
        ├── serial/
        ├── branch/
        └── parallel/
  affected_areas:
    - types/ — 新建，核心数据结构
    - interfaces/ — 新建，服务接口抽象
    - proto/ — 新建，gRPC 协议定义
    - rpc/ — 新建，gRPC 客户端/服务端桩代码封装
    - dag/ — 新建，DAG 算法
    - storage/sqlserver/ — 新建，持久化实现
    - queue/redis/ — 新建，任务队列
    - lock/redis/ — 新建，分布式锁
    - registry/nacos/ — 新建，服务注册发现
    - engine/ — 新建，调度引擎核心
    - worker/ — 新建，分布式执行节点
    - endpoint/http/ — 新建，HTTP 触发入口
    - examples/ — 新建，集成示例
  component_details:
    - component: types
      responsibility: 定义所有核心枚举（WorkflowStatus/NodeStatus/ConnectionType/DependencyMode）和业务结构体（WorkflowDef/WorkflowNode/Connection/WorkflowInstance/WorkflowNodeState/WorkflowContext/NodeWorkerInfo/Task/TaskResult）
      interfaces:
        - 纯数据结构，无方法，供其他所有包引用
    - component: interfaces
      responsibility: 声明 WorkflowService / SchedulerService / InstanceStateService / WorkerManagerService / HTTPEndpointService / NodeExecutor / NodeExecutorContainer / TaskExecutionManager / WorkflowRepository / RedisRepository / DistributedLock / TaskQueueManager / ContextManager / WorkflowLoader / ErrorHandler 接口
      interfaces:
        - 全部为 Go interface，无实现代码
    - component: proto + rpc
      responsibility: 定义 EngineService 和 NodeWorkerService 的 Protobuf 协议，生成 Go 代码，封装 gRPC 客户端（EngineClient/WorkerClient）连接管理与超时控制
      interfaces:
        - EngineServiceClient / EngineServiceServer
        - NodeWorkerServiceClient / NodeWorkerServiceServer
    - component: dag
      responsibility: WorkflowDef 到邻接表的转换、DFS 循环依赖检测、前置节点依赖满足检查（All/Any 模式）、可执行节点集合计算
      interfaces:
        - DAGParser.Parse(def) → DAGGraph
        - DAGGraph.HasCycle() bool
        - DAGGraph.GetReadyNodes(states) []string
    - component: storage/sqlserver
      responsibility: 实现 WorkflowRepository 接口，包含 4 张表的 CRUD、索引创建 DDL、连接池管理、预编译语句、事务控制
      interfaces:
        - NewSQLServerRepository(dsn string) (WorkflowRepository, error)
    - component: queue/redis
      responsibility: 实现 TaskQueueManager 接口，基于 Redis List（LPUSH/BRPOP）实现分布式任务队列
      interfaces:
        - NewRedisTaskQueue(client RedisRepository) TaskQueueManager
    - component: lock/redis
      responsibility: 实现 DistributedLock 接口，基于 Redis SETNX + Lua 脚本 + WatchDog 自动续期
      interfaces:
        - NewRedisLock(client RedisRepository, key, value string) DistributedLock
    - component: registry/nacos
      responsibility: 封装 Nacos SDK，实现 Worker 注册/注销/心跳/服务发现，向 WorkerManagerService 推送 Worker 上下线事件
      interfaces:
        - NacosRegistry.Register(info NodeWorkerInfo) error
        - NacosRegistry.Deregister(workerID string) error
        - NacosRegistry.Subscribe(handler WorkerEventHandler) error
    - component: engine
      responsibility: 实现 WorkflowService / SchedulerService / InstanceStateService / WorkerManagerService / HTTPEndpointService 五大服务，组合所有基础设施组件完成完整调度链路
      interfaces:
        - Engine.Start() error / Engine.Stop() error
    - component: worker
      responsibility: 实现 NodeWorker 主体，含 gRPC 服务端、NodeExecutorContainer、TaskExecutionManager、心跳模块、错误上报模块，内置 log/http/sleep 三种执行器
      interfaces:
        - NodeWorker.Start() error / NodeWorker.Stop() error
        - NodeWorker.Register(executor NodeExecutor) error
    - component: endpoint/http
      responsibility: 实现 HTTPEndpointService，基于 Gin 提供 POST /api/v1/workflow/{workflowID}/start 接口
      interfaces:
        - HTTPEndpoint.Start(addr string) error
        - HTTPEndpoint.RegisterWorkflowEndpoint(workflowID, path string) error
    - component: examples
      responsibility: 提供 3 个可直接运行的完整示例，覆盖串行、分支、并行三种 DAG 模式，演示自定义执行器注册与使用
      interfaces:
        - main() 入口，可通过 go run 直接运行
  dependencies:
    - component: interfaces
      relationship: 依赖 types（接口方法签名使用 types 中的结构体）
    - component: dag
      relationship: 依赖 types（接受 WorkflowDef 作为输入）
    - component: storage/sqlserver
      relationship: 依赖 interfaces（实现 WorkflowRepository）、依赖 types
    - component: queue/redis
      relationship: 依赖 interfaces（实现 TaskQueueManager、使用 RedisRepository）、依赖 types
    - component: lock/redis
      relationship: 依赖 interfaces（实现 DistributedLock、使用 RedisRepository）
    - component: rpc
      relationship: 依赖 proto 生成代码
    - component: engine
      relationship: 依赖 interfaces / dag / rpc / storage / queue / lock / registry
    - component: worker
      relationship: 依赖 interfaces / rpc / registry / types
    - component: endpoint/http
      relationship: 依赖 engine（调用 WorkflowService.StartWorkflow）
    - component: examples
      relationship: 依赖 engine / worker / endpoint/http
  integration_points:
    - Engine 通过 gRPC（rpc/）调用 NodeWorker 的 AssignTask / CancelTask
    - NodeWorker 通过 gRPC（rpc/）调用 Engine 的 ReportTaskResult / ReportError / Heartbeat
    - Engine 和 NodeWorker 通过 Nacos（registry/nacos/）完成服务注册与发现
    - Engine 的 SchedulerService 通过 queue/redis/ 入队/出队待执行任务
    - Engine 通过 lock/redis/ 保证集群部署时调度操作的互斥性
    - Engine 和 NodeWorker 的所有状态通过 storage/sqlserver/ 持久化

