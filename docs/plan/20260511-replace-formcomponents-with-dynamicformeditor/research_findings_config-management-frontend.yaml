patterns_found:
  - category: architecture
    pattern: 表单 schema 以字符串 formSchema 存储，页面层负责 JSON parse/stringify
    description: API 仅传输字符串，结构校验主要发生在前端视图层
    examples:
      - file: config-management/frontend/src/views/FormDesigner.vue
        location: 75
        snippet: const schema = JSON.parse(def.formSchema || '{}')
      - file: config-management/frontend/src/views/FormDesigner.vue
        location: 88
        snippet: JSON.stringify({ fields: fields.value })
    prevalence: common
  - category: structure
    pattern: 设计器 schema 与渲染组件 schema 双轨并存
    description: FormDesigner 与 DynamicFormEditor 的字段命名、类型枚举、扩展属性不一致
    examples:
      - file: config-management/frontend/src/views/FormDesigner.vue
        location: 11
        snippet: type: 'text' | 'textarea' | 'number' | 'select' | 'date' | 'checkbox' | 'radio'
      - file: config-management/frontend/src/components/DynamicFormEditor.vue
        location: 15
        snippet: field.type === 'input'
      - file: config-management/frontend/src/components/DynamicFormEditor.vue
        location: 63
        snippet: field.type === 'selectMultiple'
    prevalence: common
  - category: naming
    pattern: 字段主键命名存在 name vs key 差异
    description: 旧链路使用 field.name，新组件使用 field.key
    examples:
      - file: config-management/frontend/src/components/FormComponents.vue
        location: 49
        snippet: :key="field.name"
      - file: config-management/frontend/src/components/DynamicFormEditor.vue
        location: 8
        snippet: :key="field.key"
    prevalence: common
  - category: error_handling
    pattern: 异常以 UI 消息提示为主，吞掉细节异常
    description: catch 分支普遍直接 ElMessage.error
    examples:
      - file: config-management/frontend/src/views/FormDesigner.vue
        location: 80
        snippet: ElMessage.error('加载表单失败')
      - file: config-management/frontend/src/components/DynamicFormEditor.vue
        location: 164
        snippet: ElMessage.error('加载选项失败')
    prevalence: common
