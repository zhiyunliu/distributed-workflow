plan_id: 20260511-replace-formcomponents-with-dynamicformeditor
objective: 精确定位前端中 FormComponents 的使用与可替换落点，给出最小改动方案（不改 DynamicFormEditor 逻辑，仅样式可改）
focus_area: config-management frontend
created_at: 2026-05-11
created_by: GitHub Copilot (GPT-5.3-Codex)
status: completed
tldr: |
  - FormComponents 仅存在于组件声明文件，当前无业务页面直接引用。
  - DynamicFormEditor 目前未被任何页面接入，属于未接线组件。
  - 现有表单设计链路围绕 FormDesigner 的 schema 字段结构（name/type/options）展开。
  - DynamicFormEditor 使用另一套 schema（key/type/commonApi/columns），与 FormDesigner 不兼容。
  - 前端存在已有路由路径与参数命名不一致，会影响接入验证路径。
