plan_id: "20260511-replace-formcomponents-with-dynamicformeditor"
objective: "定位 Go 代码中为 DynamicFormEditor 缺失的 schema 属性补齐点，并给出兼容最小改动方案"
focus_area: "runtime-execution + config-management backend"
created_at: "2026-05-11"
created_by: "GPT-5.3-Codex"
status: completed
tldr: |
  - Go 侧表单定义统一使用 formSchema（map[string]interface{}），未暴露 schema 同义字段。
  - DynamicFormEditor 组件依赖 schema 顶层对象及其 fields/commonApi 等子属性。
  - SQL Server 持久化字段为 workflow_form_definition.form_schema（NVARCHAR），通过 marshal/unmarshal 在 map 与 JSON 字符串之间转换。
  - config-management backend 的 D6 表单 handler 使用 types.FormDefinition 直接绑定请求体。
  - config-management/backend/cmd/api/main.go 当前未注入 SetD6FormService，D6 表单路由初始化链未在该入口体现。
