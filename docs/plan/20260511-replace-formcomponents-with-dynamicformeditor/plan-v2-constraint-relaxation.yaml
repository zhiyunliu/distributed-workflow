implementation_specification:
  architecture_overview: |
    本方案采用"编排 + 适配 + 展示"三层架构（允许 DynamicFormEditor 完全重构）：
    
    1. FormDesigner（编排层）：承载表单编辑交互逻辑，与用户直接交互，管理编辑状态、保存、发布等流程；包含所有表单编辑方法（字段增删改、表格行增删、验证、提交等）；
    
    2. 适配层（双向映射）：前端负责 schema/formSchema 归一化，Go 层在边界执行 schema 别名兼容和冲突优先级处理；
    
    3. DynamicFormEditor（展示层）：【新约束】完全重构为纯显示组件，接收标准化后的 schema 与 readonly flag，仅处理字段展示与值显示（v-if/v-model 分支），不包含任何编辑交互逻辑。
    
  data_flow: |
    加载流程：
      后端返回 schema(json) --> 前端适配层标准化 --> DynamicFormEditor 纯展示渲染
    
    保存流程（所有编辑逻辑在 FormDesigner）：
      FormDesigner 编辑收集（addTableRow/delTableRow/submitForm/verify 等） --> 前端适配层逆向映射 --> 后端适配层归一化 --> 存储
  
  code_structure: |
    采用"逻辑迁移 + 适配层 + 最小兼容契约"方案：
    
    1) T-FE-04 DynamicFormEditor 重构：删除所有编辑方法（addTableRow/delTableRow/submitForm/verify）与业务逻辑判断，仅保留字段渲染与值显示（v-if/v-model 分支）；
    2) T-FE-03 FormDesigner 接线：完整迁移 DynamicFormEditor 删除的编辑方法至 FormDesigner，通过适配层将标准化 schema 传递给 DynamicFormEditor 用于预览展示；
    3) 前端新增 schema 归一化工具，负责 old(name/type/options) <-> editor(key/type/commonApi/columns) 转换；
    4) Go 类型层补齐 schema 别名兼容字段及归一化方法（T-BE-01）；
    5) Go handler/service 边界执行入参/出参归一化，不触碰 repository map+JSON 持久化（T-BE-02）。
    
  affected_areas:
    - "config-management/frontend/src/components/DynamicFormEditor.vue (重构：删除编辑逻辑，仅保留展示)"
    - "config-management/frontend/src/views/FormDesigner.vue (新增：迁移编辑逻辑)"
    - "config-management/frontend/src/views/FormList.vue"
    - "config-management/frontend/src/router/index.ts"
    - "config-management/frontend/src/api/form.ts"
    - "config-management/frontend/src/types/form.ts"
    - "config-management/frontend/src/utils/ (新增 schema 适配工具)"
    - "runtime-execution/pkg/types/form_types.go"
    - "runtime-execution/internal/common/types/form_types.go"
    - "config-management/backend/internal/handler/server_d6_form.go"
    - "runtime-execution/internal/engine/form_service.go"
    
  component_details:
    - component: "DynamicFormEditor（展示层）【约束变更】"
      responsibility: "【新约束】完全重构为纯显示组件；接收标准化 schema 与 readonly flag 后，仅处理字段展示与值显示（v-if/v-model 分支）；删除所有编辑交互逻辑（addTableRow/delTableRow/submitForm/verify 等）"
      key_constraint: "仅包含显示逻辑，不包含任何编辑交互"
      deletion_checklist: ["addTableRow 方法", "delTableRow 方法", "submitForm 方法", "verify/validate 逻辑", "onInput 编辑事件处理", "所有编辑相关的 v-on:click 指令"]
      retained_methods: ["onMounted (读取初始化数据)", "loadAllOptions (填充下拉选项)", "getRules (获取验证规则用于显示提示)", "字段渲染的 v-if/v-model", "值显示与格式化"]
      interfaces: ["v-model:schema for field rendering", "props:readonly (强制只读)", "props:editingData (可选，用于与 FormDesigner 同步显示)"]
      dependencies:
        - component: "FormDesigner"
          relationship: "被 FormDesigner 编排层使用，接收编辑结果通过 editingData 同步更新展示"
      integration_points: ["实时字段展示", "编辑后值同步显示", "发布前预览验证"]
    - component: "FormDesigner（编排层）【需迁移逻辑】"
      responsibility: "表单编辑入口；管理编辑交互逻辑、状态管理、保存/发布流程；【新增】完整承载 DynamicFormEditor 删除的编辑方法（addTableRow/delTableRow/submitForm/verify）；通过适配层与 DynamicFormEditor 交互"
      key_responsibility: "所有表单编辑、字段添加/修改/删除、表格行增删、验证、提交等交互逻辑均在此层实现，DynamicFormEditor 仅负责展示"
      migrated_methods_from_dynamicformeditor: ["addTableRow", "delTableRow", "submitForm", "verify/validate"]
    - component: "前端 schema 归一化适配层"
      responsibility: "统一处理 schema:string|object、formSchema:string|object、name/key、旧 type 与标准化 type 的双向映射；作为 FormDesigner 与 DynamicFormEditor 之间的转接器"
      interfaces: ["normalizeToDynamicSchema(input) -> DynamicSchema", "normalizeToPersistedSchema(input) -> PersistedSchema"]
      dependencies:
        - component: "FormDesigner"
          relationship: "被调用（在加载与保存时调用）"
        - component: "DynamicFormEditor"
          relationship: "向其提供标准化 schema 数据"
      integration_points: ["表单加载", "表单保存", "表单发布"]
    - component: "Go 表单定义兼容契约"
      responsibility: "补齐 schema 别名字段并在边界层执行归一化，保持 repository 不变"
      interfaces: ["FormDefinition.NormalizeSchema()", "FormDefinition.EffectiveSchema()"]
      dependencies:
        - component: "D6 Form Handler"
          relationship: "调用归一化"
        - component: "FormService"
          relationship: "二次兜底"
      integration_points: ["POST /api/forms", "PUT /api/forms/:id", "GET /api/forms/:id"]
    - component: "路由兼容层"
      responsibility: "统一 forms/designer 参数读取并兼容历史路径/参数命名"
      interfaces: ["route param resolver(formId|id)"]
      dependencies:
        - component: "FormList"
          relationship: "导航发起"
        - component: "FormDesigner"
          relationship: "参数消费"
      integration_points: ["列表页进入设计器", "直接 URL 打开设计器"]

