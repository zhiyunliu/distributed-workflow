tldr: |
  本计划采用 5 个 Wave、12 个任务（新增 T-RV-DECISION-00 与 T-FE-04），目标将表单编辑页面的 FormComponents 替换为 DynamicFormEditor（允许完全重构以实现清晰分层）：
  
  架构变更：从"DynamicFormEditor 仅样式可改"升级为"完全分离显示层与编辑层"，通过新增 T-FE-04 专项重构清除职责混淆。
  
  - Wave 1 前后端并行完成 D6 FormService 注入就绪、Go schema 兼容契约、前端 schema 归一化适配层、路由兼容基线。
  - Wave 2 前后端继续并行，先执行显式决策收敛 gate（T-RV-DECISION-00）冻结编辑迁移与同步契约，再完成【新增】DynamicFormEditor 逻辑分离重构（T-FE-04）→ FormDesigner 编排层通过适配器接入 DynamicFormEditor 预览渲染（T-FE-03）→ 后端入出参归一化（T-BE-02）。
  - Wave 3 执行 pre-QA 边界审查 gate，新审查标准：确保 DynamicFormEditor 仅包含显示逻辑（v-if/v-model 分支），编辑逻辑完全迁移至 FormDesigner。
  - Wave 4 执行兼容回归验证与正式约束审查。
  - Wave 5 补齐迁移说明与兼容矩阵文档，重点说明新的分层架构与职责边界。
  
  核心理念：DynamicFormEditor 作为纯展示层（接收标准化 schema 后仅处理字段渲染和值显示），FormDesigner 为编排/编辑入口（承载所有编辑交互逻辑），适配层负责数据转换。全流程坚持最小改动：repository 与 SQL schema 零改动。

