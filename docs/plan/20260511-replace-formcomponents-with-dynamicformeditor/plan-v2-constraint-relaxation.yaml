    - scenario: "前端只做单向归一化，导致保存后 schema 回写与旧数据不兼容"
      likelihood: medium
      impact: high
      mitigation: "T-FE-01 定义双向映射规则；T-QA-01 增加字符串/对象/旧字段三类样例回归。"
    - scenario: "Go 层新增 schema 别名字段后出现 formSchema/schema 冲突覆盖"
