    - "DynamicFormEditor 重构删除的方法（addTableRow/delTableRow/submitForm/verify）将被完整迁移至 FormDesigner，保证设计器功能无退化。"
    - "schema-adapter.ts 的双向映射保持不变（已验证）。"
    - "repository 层 form_schema 持久化逻辑与 SQL 字段不做变更。"
    - "前端允许新增 schema 归一化适配层来桥接历史数据与新渲染层。"
