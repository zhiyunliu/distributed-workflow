      mitigation: "T-FE-04 与 T-FE-03 需要协同梳理编辑方法的完整功能清单；code review 时强制校验每个移出的方法的目标承载地。"
    - scenario: "D6 FormService 未注入或注入顺序错误，导致 /api/forms 运行时空服务"
