plan_id: "20260511-replace-formcomponents-with-dynamicformeditor"
objective: "将 FormComponents 替换为 DynamicFormEditor（逻辑保持不变，仅允许样式相关代码调整），并行推进前后端改造，补齐 Go 侧对 schema 的兼容支持，同时确保最小兼容。"
created_at: "2026-05-11T00:00:00+08:00"
created_by: "gem-planner"
status: pending
research_confidence: high

plan_metrics:
  wave_1_task_count: 4
  total_dependencies: 12
  risk_score: medium

tldr: |
  本计划采用 5 个 Wave、10 个任务，目标将表单编辑页面的渲染层从 FormComponents 替换为 DynamicFormEditor（逻辑保持不变，仅允许样式调整）：
  - Wave 1 前后端并行完成 D6 FormService 注入就绪、Go schema 兼容契约、前端 schema 归一化适配层、路由兼容基线。
  - Wave 2 前后端继续并行，完成 FormDesigner 编排层通过适配器接入 DynamicFormEditor 预览渲染、后端入出参归一化。
  - Wave 3 执行 pre-QA 边界审查 gate，提前阻断越界改动（确保 DynamicFormEditor 逻辑不变、仅样式可调）。
  - Wave 4 执行兼容回归验证与正式约束审查。
  - Wave 5 补齐迁移说明与兼容矩阵文档。
  核心理念：DynamicFormEditor 作为渲染组件（接收标准化 schema 后完成字段展示，逻辑保持不变）；FormDesigner 为编排/编辑入口；适配层负责数据转换。全流程坚持最小改动：DynamicFormEditor 仅允许样式调整、不改业务逻辑，不改 repository 持久化 map + SQL schema 字段。

open_questions: []

minimum_dod_checklist:
  - "D6 FormService 注入状态已在运行入口校验并落地，联调链路可用。"
  - "schema 与 formSchema 同时存在且冲突时，固定采用 schema > formSchema；仅当 schema 缺失时回退 formSchema，并有断言验证。"
  - "输入类型边界固定为 schema:string|object 与 formSchema:string|object，并在 FE/BE/QA 三侧一致验证。"
  - "DynamicFormEditor 业务逻辑保持不变，仅允许样式相关代码调整（CSS/样式变量/布局适配）；禁止修改字段渲染、值处理、验证等逻辑。"
  - "编辑交互逻辑（字段增删改、值绑定、验证等）全部由 FormDesigner 在编排层维护，不分散到 DynamicFormEditor。"
  - "repository 与 SQL schema 零改动。"
  - "旧路由参数 id 与标准参数 formId 均可完成加载-编辑-保存。"
  - "最小兼容矩阵（旧字段/新字段/schema:string|object/formSchema:string|object）全部通过。"

