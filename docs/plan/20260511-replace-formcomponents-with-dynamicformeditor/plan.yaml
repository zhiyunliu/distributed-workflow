implementation_specification:
  architecture_overview: |
    本方案采用"编排 + 适配 + 展示"三层架构：
    1. FormDesigner（编排层）：承载表单编辑交互逻辑，与用户直接交互，管理编辑状态、保存、发布等流程；
    2. 适配层（双向映射）：前端负责 schema/formSchema 归一化，Go 层在边界执行 schema 别名兼容和冲突优先级处理；
    3. DynamicFormEditor（渲染层）：接收标准化后的 schema，完成字段展示。业务逻辑保持不变，仅允许样式调整，不参与编辑交互（编辑由 FormDesigner 承载）。
  data_flow: |
    加载流程：
      后端返回 schema(json) --> 前端适配层标准化 --> DynamicFormEditor 渲染展示
    保存流程：
      FormDesigner 编辑收集 --> 前端适配层逆向映射 --> 后端适配层归一化 --> 存储
  code_structure: |
    采用"适配层 + 最小兼容契约"方案：
    1) 前端新增 schema 归一化工具，负责 old(name/type/options) <-> editor(key/type/commonApi/columns) 转换；
    2) FormDesigner 作为编排入口管理编辑流程，通过适配层将数据喂给 DynamicFormEditor 用于实时预览/展示；
    3) Go 类型层补齐 schema 别名兼容字段及归一化方法；
    4) Go handler/service 边界执行入参/出参归一化，不触碰 repository map+JSON 持久化。
  affected_areas:
    - "config-management/frontend/src/views/FormDesigner.vue"
    - "config-management/frontend/src/views/FormList.vue"
    - "config-management/frontend/src/router/index.ts"
    - "config-management/frontend/src/api/form.ts"
    - "config-management/frontend/src/types/form.ts"
    - "config-management/frontend/src/utils/ (新增 schema 适配工具)"
    - "runtime-execution/pkg/types/form_types.go"
    - "runtime-execution/internal/common/types/form_types.go"
    - "config-management/backend/internal/handler/server_d6_form.go"
    - "runtime-execution/internal/engine/form_service.go"
  component_details:
    - component: "前端 schema 归一化适配层"
      responsibility: "统一处理 schema:string|object、formSchema:string|object、name/key、旧 type 与标准化 type 的双向映射；作为 FormDesigner 与 DynamicFormEditor 之间的转接器"
      interfaces: ["normalizeToDynamicSchema(input) -> DynamicSchema", "normalizeToPersistedSchema(input) -> PersistedSchema"]
      dependencies:
        - component: "FormDesigner"
          relationship: "被调用（在加载与保存时调用）"
        - component: "DynamicFormEditor"
          relationship: "向其提供标准化 schema 数据"
      integration_points: ["表单加载", "表单保存", "表单发布"]
    - component: "DynamicFormEditor（渲染层）"
      responsibility: "复用现有业务逻辑的动态渲染组件；接收标准化 schema 后完成字段展示；保留现有的字段处理、验证、值绑定等基线逻辑，仅允许样式调整；不参与编辑交互新增需求（编辑交互逻辑由 FormDesigner 管理）"
      interfaces: ["v-model:schema for field rendering", "props:readonly (optional)"]
      constraints: ["仅允许样式相关代码调整以适配布局（CSS/样式变量/布局）", "保留现有业务逻辑，不能删除或重构 onMounted/loadAllOptions/getRules 等基线能力", "不参与编辑交互新增需求，新逻辑由 FormDesigner 承载"]
      dependencies:
        - component: "FormDesigner"
          relationship: "被 FormDesigner 编排层使用以展示设计预览"
      integration_points: ["实时字段展示", "发布前预览验证"]
    - component: "FormDesigner（编排层）"
      responsibility: "表单编辑入口；管理编辑交互逻辑、状态管理、保存/发布流程；通过适配层与 DynamicFormEditor 交互"
      key_responsibility: "所有表单编辑、字段添加/修改/删除等交互逻辑均在此层实现，DynamicFormEditor 仅负责展示"
    - component: "Go 表单定义兼容契约"
      responsibility: "补齐 schema 别名字段并在边界层执行归一化，保持 repository 不变"
      interfaces: ["FormDefinition.NormalizeSchema()", "FormDefinition.EffectiveSchema()"]
      dependencies:
        - component: "D6 Form Handler"
          relationship: "调用归一化"
        - component: "FormService"
          relationship: "二次兜底"
      integration_points: ["POST /api/forms", "PUT /api/forms/:id", "GET /api/forms/:id"]
    - component: "路由兼容层"
      responsibility: "统一 forms/designer 参数读取并兼容历史路径/参数命名"
      interfaces: ["route param resolver(formId|id)"]
      dependencies:
        - component: "FormList"
          relationship: "导航发起"
        - component: "FormDesigner"
          relationship: "参数消费"
      integration_points: ["列表页进入设计器", "直接 URL 打开设计器"]

