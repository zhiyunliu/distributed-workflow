# ─────────────────────────────────────────────────
# 五、当前约定
# ─────────────────────────────────────────────────
related_conventions:
  naming_patterns_in_domain: |
    Go 包名：小写单词，与目录名一致（除 sysbuiltin 包名为 builtin）
    结构体：大驼峰，含 JSON 标签
    接口文件：按职责拆分（services.go / components.go / repository.go）
    前端组件：大驼峰 .vue 文件（UserManage.vue、WorkflowDesigner.vue）
    前端 API 封装：小写文件名匹配后端资源名（workflow.ts、instance.ts）

  structure_of_domain: |
    单一 Go 模块，所有包在同一 module 下平铺
    前后端分离（web/ 独立前端项目，后端无前端资产）
    examples/ 作为顶层组装入口（无独立 cmd/）

  error_handling_in_domain: |
    Go：错误显式返回，禁止忽略 error，函数签名末尾返回 error
    HTTP：统一 JSON 响应体 {code, message, data}
    gRPC：返回标准 grpc status error

  testing_in_domain: |
    单元测试文件与被测文件同目录（_test.go 后缀）
    覆盖包：engine/worker_manager_test.go、worker/executor_container_test.go、worker/executors/executors_test.go

  documentation_in_domain: |
    每个包有 doc.go 包文档
    接口/结构体有详细注释（中文）


# ─────────────────────────────────────────────────
# 六、依赖汇总（迁移关键）
# ─────────────────────────────────────────────────
related_dependencies:
  internal:
    - component: types
      relationship_to_domain: 所有包的共同基础，零内部依赖
      direction: outbound

    - component: proto
      relationship_to_domain: gRPC 消息定义，被 rpc/engine/worker 使用
      direction: outbound

    - component: interfaces
      relationship_to_domain: 核心抽象层，被 engine/worker/endpoint/sysbuiltin 依赖
      direction: outbound

    - component: dag
      relationship_to_domain: 仅被 engine/scheduler.go 使用
      direction: outbound

    - component: rpc
      relationship_to_domain: 被 engine（worker_client）和 worker（engine_client）双向使用
      direction: bidirectional

    - component: plugin
      relationship_to_domain: 被 engine 使用（plugin_service.go）
      direction: outbound

    - component: "storage/sqlserver"
      relationship_to_domain: 被 engine/engine.go 直接 import（依赖具体实现，非接口）
      direction: outbound

    - component: "storage/redis"
      relationship_to_domain: 被 engine/scheduler.go 直接 import
      direction: outbound

    - component: "endpoint/schedule"
      relationship_to_domain: 被 engine/schedule_manager.go import（跨层依赖）
      direction: outbound

    - component: jwtutil
      relationship_to_domain: 被 sysbuiltin/auth_service.go 和 endpoint/http/server_d4.go 使用
      direction: outbound

    - component: sysmodel
      relationship_to_domain: 系统管理基础模型，被 sysmanager/sysrepo/sysbuiltin/syssqlserver 使用
      direction: outbound

    - component: sysrepo
      relationship_to_domain: 仓储接口，被 sysbuiltin/syssqlserver 实现
      direction: outbound

    - component: sysmanager
      relationship_to_domain: 服务接口，被 sysbuiltin/endpoint/http 使用
      direction: outbound

    - component: sysbuiltin
      relationship_to_domain: 系统管理业务逻辑，被 examples/main.go 或 engine 注入
      direction: inbound

    - component: syssqlserver
      relationship_to_domain: 系统管理数据层，被组装层（examples/engine）使用
      direction: inbound

  external:
    - name: gin v1.12.0
      purpose_for_domain: HTTP 路由
    - name: grpc v1.80.0
      purpose_for_domain: Engine ↔ Worker RPC
    - name: go-mssqldb v1.9.8
      purpose_for_domain: SQL Server 驱动
    - name: go-redis v9.18.0
      purpose_for_domain: Redis 客户端
    - name: zerolog v1.35.1
      purpose_for_domain: 日志
    - name: uuid v1.6.0
      purpose_for_domain: ID 生成
    - name: nacos-sdk-go v2.3.5
      purpose_for_domain: 服务注册


# ─────────────────────────────────────────────────
# 七、安全性观察
# ─────────────────────────────────────────────────
domain_security_considerations:
  sensitive_areas:
    - area: JWT 生成与验证
      location: jwtutil/jwt.go
      concern: 纯标准库 HS256 实现，迁移后密钥需通过配置文件/环境变量注入，不可硬编码
    - area: SQL Server 连接字符串
      location: storage/sqlserver/repository.go
      concern: DSN 包含凭据，迁移后需确保通过配置注入
    - area: D6 OAuth 服务
      location: "engine/oauth_service.go, storage/sqlserver/oauth_repository.go"
      concern: OAuth token 需安全存储，迁移后需检查加密机制
  authentication_patterns_in_domain: JWT Bearer Token（Authorization 请求头）
  authorization_patterns_in_domain: 基于角色（Role）权限校验，sysmanager.PermissionService
  data_validation_in_domain: gin validator + 业务层手动校验


# ─────────────────────────────────────────────────
# 八、测试模式
# ─────────────────────────────────────────────────
testing_patterns:
  framework: Go 标准 testing 包
  coverage_areas:
    - engine/worker_manager（单元测试）
    - worker/executor_container（单元测试）
    - worker/executors（内置执行器单元测试）
  test_organization: 测试文件与被测文件同目录，_test.go 后缀
  mock_patterns:
    - 接口 mock（golang/mock v1.6.0）


# ─────────────────────────────────────────────────
# 九、开放问题（迁移决策点）
# ─────────────────────────────────────────────────
open_questions:
  - question: config-management 后端是否应创建独立的 go.mod？
    context: |
      目标架构有两个独立应用（config-management/backend 和 runtime-execution），
      各自需要独立的 go.mod 吗？还是保留 monorepo 单 module？
    type: decision_blocker
    affects:
      - go.mod 拆分策略
      - 所有 import 路径（需全量替换）
      - examples/ 中的 import

  - question: endpoint/http 中管理路由与触发路由如何拆分？
    context: |
      当前 Server 结构体混合了 D1-D3 的流程触发路由和 D4-D6 的系统管理路由。
      目标架构将管理路由归 config-management/backend，触发路由归 runtime-execution/pkg/endpoint。
      需要决定拆分边界（哪些 handler 进哪个子模块）。
    type: decision_blocker
    affects:
      - config-management/backend/internal/handler/ 内容
      - runtime-execution/pkg/endpoint/ 内容
      - sysbuiltin/syssqlserver 归属

  - question: engine 依赖 storage/sqlserver（具体实现）是否在迁移时改为依赖接口？
    context: |
      engine/engine.go 直接 import storage/sqlserver（具体实现），
      违反依赖倒置原则。迁移是否同时重构为依赖 interfaces.WorkflowRepository？
    type: decision_blocker
    affects:
      - runtime-execution/internal/engine/ 结构
      - 是否需要在 engine 新增依赖注入初始化代码

  - question: jwtutil 是否成为两个子模块的共享库？
    context: |
      jwtutil 目前被 sysbuiltin 和 endpoint/http 使用，
      迁移后如果是双模块，需要决定：放入 config-management 还是提取为第三个内部包。
    type: decision_blocker
    affects:
      - go.mod 结构
      - import 路径

  - question: sysbuiltin 包名 builtin 与目录名 sysbuiltin 不一致，迁移时是否同步修正？
    context: |
      sysbuiltin/manager.go 声明 package builtin，但目录名是 sysbuiltin。
      迁移是修正包名为 sysbuiltin 还是改目录名为 builtin？
    type: nice_to_know
    affects:
      - 所有 import sysbuiltin 的文件

  - question: proto 文件是否为两个模块共享？还是各自维护副本？
    context: |
      gRPC 协议在 runtime-execution 内部使用，config-management 不直接使用 gRPC。
      因此 proto 可以仅属于 runtime-execution。
    type: decision_blocker
    affects:
      - runtime-execution/internal/proto/ 位置
      - proto 生成命令（Makefile）

  - question: 数据库 schema SQL 文件迁移到哪个子模块？
    context: |
      schema.sql 系列目前在 storage/sqlserver/ 下，包含工作流表和系统管理表（D4）。
      拆分后需确定各 sql 文件的归属子模块。
    type: nice_to_know
    affects:
      - config-management 数据库初始化
      - runtime-execution 数据库初始化


# ─────────────────────────────────────────────────
# 十、迁移难点 & 缺口
# ─────────────────────────────────────────────────
gaps:
  - area: 无独立 cmd/ 入口
    description: |
      当前无 cmd/engine 或 cmd/worker 目录，服务启动逻辑分散在 examples/ main.go 中。
      目标架构要求创建 runtime-execution/cmd/engine/ 和 runtime-execution/cmd/worker/。
      需要新建这两个入口文件。
    impact: decision_blocker
    affects:
      - runtime-execution/cmd/engine/main.go（新建）
      - runtime-execution/cmd/worker/main.go（新建）

  - area: config-management/backend 无现成入口
    description: |
      当前没有专门的配置管理后端服务入口，系统管理 HTTP 接口混在 endpoint/http 中。
      需要新建 config-management/backend/cmd/api/main.go，
      提取 sysbuiltin + syssqlserver + endpoint/http(管理部分) 的组装逻辑。
    impact: decision_blocker
    affects:
      - config-management/backend/cmd/api/main.go（新建）

  - area: engine 直接依赖 storage 具体实现
    description: |
      engine.go import storage/sqlserver（非接口），违反依赖倒置。
      迁移时若不同步重构，则 runtime-execution/internal/engine 仍强绑定 sqlserver。
      若重构则需新增 engine 初始化 wire/构造函数改造工作量。
    impact: research_blocker
    affects:
      - runtime-execution/internal/engine/engine.go

  - area: engine 依赖 endpoint/schedule（跨层）
    description: |
      engine/schedule_manager.go import endpoint/schedule，
      迁移到新结构后两者可能在不同子目录，但如果同属 runtime-execution 则问题不大。
      若 endpoint 单独提取为 pkg/endpoint，则需确认 internal/engine 可以 import pkg/endpoint。
    impact: research_blocker
    affects:
      - runtime-execution/internal/engine/schedule_manager.go
      - runtime-execution/pkg/endpoint/schedule/

  - area: go.mod 模块路径全量替换
    description: |
      当前所有 import 使用 github.com/zhiyunliu/distributed-workflow/xxx。
      拆分为双 module 后，import 路径将变为：
        - github.com/zhiyunliu/distributed-workflow/config-management/backend/...
        - github.com/zhiyunliu/distributed-workflow/runtime-execution/...
      或使用全新模块路径，需要对 ~70+ import 行全量替换（可通过脚本批量处理）。
    impact: decision_blocker
    affects:
      - 全部 .go 文件

  - area: 前端 API 基础路径配置
    description: |
      前端拆分后若 config-management/frontend 请求的后端由独立服务提供，
      需确认 vite.config.ts 中的 proxy 配置和 src/utils/request.ts 的 baseURL 指向。
      当前 web/ 已配置 vite.config.ts（禁止修改）。
    impact: nice_to_know
    affects:
      - config-management/frontend/（web/ 整体迁移）
      - vite.config.ts proxy 配置
