plan_id: 20260428-project-restructure
objective: 分析 distributed-workflow 项目当前代码结构，为制定详细文件迁移计划提供基础
focus_area: 项目目录结构、包依赖关系、go.mod 内容、前端代码位置
created_at: "2026-04-28"
created_by: RESEARCHER
status: completed

tldr:
  - 当前项目为单 Go 模块 (github.com/zhiyunliu/distributed-workflow)，所有包平铺在根目录
  - 核心依赖层次：types/proto → interfaces → engine/worker/storage → endpoint → examples
  - 前端代码位于 web/，含完整 Vue3+Vite+TypeScript+Element Plus 项目，需整体迁移
  - engine 包直接 import storage/sqlserver 和 endpoint/schedule，是最重依赖包
  - 迁移到多子模块结构时，最大挑战是拆分 go.mod 并重写所有 import 路径

research_metadata:
  methodology: "list_dir + grep_search(import 扫描) + read_file(关键文件头部)"
  scope: "全项目所有 .go 文件及前端 package.json"
  confidence: high
  coverage: 95
  decision_blockers: 2
  research_blockers: 0

