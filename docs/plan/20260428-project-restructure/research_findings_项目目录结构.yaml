# ─────────────────────────────────────────────────
# 二、包依赖关系图谱
# ─────────────────────────────────────────────────
patterns_found:
  - category: architecture
    pattern: 分层依赖（types → interfaces → implementations）
    description: |
      types 包为零依赖基础层；
      interfaces 包只依赖 types；
      engine/worker/storage 实现层依赖 interfaces + types；
      endpoint 层依赖 interfaces + sysmanager + jwtutil；
      examples 顶层组装所有层。
    examples:
      - file: interfaces/components.go
        location: "interfaces/components.go:7"
        snippet: "\"github.com/zhiyunliu/distributed-workflow/types\""
      - file: engine/engine.go
        location: "engine/engine.go:13-16"
        snippet: |
          "github.com/zhiyunliu/distributed-workflow/interfaces"
          "github.com/zhiyunliu/distributed-workflow/plugin"
          "github.com/zhiyunliu/distributed-workflow/rpc"
          "github.com/zhiyunliu/distributed-workflow/storage/sqlserver"
    prevalence: common

  - category: architecture
    pattern: engine 直接 import endpoint/schedule（反向依赖问题）
    description: |
      engine/schedule_manager.go import 了 endpoint/schedule，
      而 endpoint/http 又使用 engine.D6ServiceInjector 接口与 engine 通信，
      形成 engine → endpoint/schedule 单向依赖（非循环，但跨层）。
      迁移后此依赖需重新设计。
    examples:
      - file: engine/schedule_manager.go
        location: "engine/schedule_manager.go:9"
        snippet: "\"github.com/zhiyunliu/distributed-workflow/endpoint/schedule\""
    prevalence: occasional

  - category: architecture
    pattern: 系统管理四层结构（sysmodel → sysrepo → sysbuiltin/syssqlserver → sysmanager）
    description: |
      sysmodel：纯数据模型，无依赖
      sysrepo：仓储接口，依赖 sysmodel
      syssqlserver：SQL Server 实现，依赖 sysmodel + sysrepo
      sysbuiltin：业务逻辑，依赖 sysmanager + sysmodel + sysrepo（+ jwtutil for auth）
      sysmanager：接口定义，依赖 sysmodel
    examples:
      - file: sysbuiltin/manager.go
        location: "sysbuiltin/manager.go:4-6"
        snippet: |
          sysmanager / sysmodel / sysrepo
    prevalence: common

  - category: architecture
    pattern: rpc 包作为 engine ↔ worker 通信桥梁
    description: |
      rpc/engine_client.go 被 worker 使用（调用 Engine gRPC）；
      rpc/worker_client.go 被 engine 使用（调用 Worker gRPC）；
      两个 client 均依赖 proto + types，无循环。
    examples:
      - file: worker/worker.go
        location: "worker/worker.go:12"
        snippet: "\"github.com/zhiyunliu/distributed-workflow/rpc\""
      - file: engine/worker_manager.go
        location: "engine/worker_manager.go:9"
        snippet: "\"github.com/zhiyunliu/distributed-workflow/rpc\""
    prevalence: common

  - category: structure
    pattern: examples 中 main.go 直接组装全部层
    description: |
      examples/*/main.go 同时 import engine、worker、endpoint/http、
      storage/redis、storage/sqlserver、types、worker/executors，
      是唯一将所有层组装在一起的入口点，目前没有独立 cmd/ 目录。
    examples:
      - file: examples/serial/main.go
        location: "examples/serial/main.go:25-31"
        snippet: |
          endpoint/http, engine, storage/redis,
          storage/sqlserver, types, worker, worker/executors
    prevalence: occasional

  - category: naming
    pattern: 包名与目录名一致（除 sysbuiltin 包名为 builtin）
    description: |
      sysbuiltin/manager.go: package builtin
      其余所有包均 package 名与目录名相同。
    examples:
      - file: sysbuiltin/manager.go
        location: "sysbuiltin/manager.go:1"
        snippet: "package builtin"
    prevalence: occasional


# ─────────────────────────────────────────────────
# 三、目录到目标结构的映射
# ─────────────────────────────────────────────────
related_architecture:
  components_relevant_to_domain:
    - component: types + proto
      responsibility: 零依赖基础数据模型与 gRPC 协议
      location: "types/ + proto/"
      relationship_to_domain: >
        映射到 runtime-execution/internal/proto/ 和
        runtime-execution/internal/common/（types 部分）

    - component: interfaces
      responsibility: 工作流引擎核心抽象接口
      location: interfaces/
      relationship_to_domain: >
        映射到 runtime-execution/pkg/api/（对外开放接口）
        以及 runtime-execution/internal/engine/ 内部接口

    - component: dag
      responsibility: DAG 拓扑排序算法
      location: dag/
      relationship_to_domain: >
        映射到 runtime-execution/internal/common/dag/

    - component: engine
      responsibility: 工作流引擎核心实现（调度、生命周期、各服务）
      location: engine/
      relationship_to_domain: >
        映射到 runtime-execution/internal/engine/（全部 .go 文件）

    - component: worker + worker/executors
      responsibility: 分布式执行节点 + 内置节点执行器
      location: "worker/ + worker/executors/"
      relationship_to_domain: >
        worker/ → runtime-execution/internal/worker/
        worker/executors/ → runtime-execution/pkg/node/

    - component: endpoint/http
      responsibility: HTTP API 端点（兼管理接口与触发接口）
      location: endpoint/http/
      relationship_to_domain: >
        触发类路由（D1-D3 workflow/instance） →
            runtime-execution/pkg/endpoint/http/
        管理类路由（D4-D6 系统管理 + 表单 + 插件 + OAuth） →
            config-management/backend/internal/handler/
        注：当前 server.go 混合了两类职责，迁移时需拆分

    - component: endpoint/schedule
      responsibility: 定时触发端点
      location: endpoint/schedule/cron.go
      relationship_to_domain: >
        映射到 runtime-execution/pkg/endpoint/schedule/

    - component: storage/redis
      responsibility: Redis 队列 + 分布式锁
      location: storage/redis/
      relationship_to_domain: >
        映射到 runtime-execution/internal/storage/redis/

    - component: storage/sqlserver
      responsibility: 工作流数据持久化（SQL Server）
      location: storage/sqlserver/
      relationship_to_domain: >
        映射到 runtime-execution/internal/storage/sqlserver/
        schema.sql 系列保留在同目录

    - component: rpc
      responsibility: engine ↔ worker gRPC 客户端封装
      location: rpc/
      relationship_to_domain: >
        映射到 runtime-execution/internal/common/rpc/ 或
        runtime-execution/internal/proto/（与 proto 合并）

    - component: plugin
      responsibility: 插件 SDK + 运行时注册表
      location: plugin/
      relationship_to_domain: >
        sdk.go → runtime-execution/pkg/api/（Plugin 接口对外开放）
        registry.go → runtime-execution/internal/engine/（内部使用）

    - component: registry/nacos
      responsibility: Nacos 服务注册
      location: registry/nacos/
      relationship_to_domain: >
        映射到 runtime-execution/pkg/loader/ 或
        runtime-execution/internal/common/registry/

    - component: jwtutil
      responsibility: HS256 JWT 工具，无项目内依赖
      location: jwtutil/
      relationship_to_domain: >
        映射到 config-management/backend/internal/（内部工具）
        或提取为两个子模块共享的公共库

    - component: sysmodel + sysrepo + sysmanager
      responsibility: 系统管理数据模型 + 接口定义
      location: "sysmodel/ + sysrepo/ + sysmanager/"
      relationship_to_domain: >
        全部映射到 config-management/backend/internal/
        sysmodel → internal/model/
        sysrepo  → internal/dao/（接口层）
        sysmanager → internal/service/（接口层）

    - component: sysbuiltin
      responsibility: 系统管理业务逻辑实现
      location: sysbuiltin/
      relationship_to_domain: >
        映射到 config-management/backend/internal/service/

    - component: syssqlserver
      responsibility: 系统管理 SQL Server 数据层
      location: syssqlserver/
      relationship_to_domain: >
        映射到 config-management/backend/internal/dao/

    - component: web
      responsibility: 前端管理界面（Vue3+Vite+TS+ElementPlus+LogicFlow）
      location: web/
      relationship_to_domain: >
        整体映射到 config-management/frontend/
        内部结构已符合目标规范（src/api/ src/views/ src/components/ 等）

    - component: examples
      responsibility: 使用示例（串行/并行/分支流程）
      location: examples/
      relationship_to_domain: >
        整体保留为 examples/，内部 main.go 中 import 路径需全部更新

  interfaces_used_by_domain:
    - interface: interfaces.WorkflowService
      location: interfaces/services.go
      usage_pattern: >
        engine.WorkflowServiceImpl 实现，endpoint/http.Server 注入调用

    - interface: interfaces.NodeExecutor
      location: interfaces/components.go
      usage_pattern: >
        worker/executors/*.go 实现，worker.ExecutorContainer 管理

    - interface: sysmanager.Manager
      location: sysmanager/interfaces.go
      usage_pattern: >
        sysbuiltin.manager 实现，endpoint/http.Server 注入

  data_flow_involving_domain: |
    HTTP请求 → endpoint/http.Server
               → engine.WorkflowServiceImpl（via interfaces）
               → storage/sqlserver.Repository（via interfaces）
               → SQL Server DB
    Worker执行 → worker.NodeWorker
               → rpc.EngineClient（gRPC）
               → engine.EngineServer
               → storage/redis.Queue（任务队列）

  key_relationships_to_domain:
    - from: engine
      to: "interfaces, types, plugin, rpc, storage/sqlserver, storage/redis(via scheduler), dag, endpoint/schedule"
      relationship: imports
    - from: worker
      to: "interfaces, rpc, proto, types, worker/executors"
      relationship: imports
    - from: "endpoint/http"
      to: "interfaces, sysmanager, types, jwtutil"
      relationship: imports
    - from: sysbuiltin
      to: "sysmanager, sysmodel, sysrepo, jwtutil"
      relationship: imports
    - from: syssqlserver
      to: "sysmodel, sysrepo"
      relationship: imports
    - from: rpc
      to: "proto, types"
      relationship: imports
    - from: "storage/sqlserver"
      to: types
      relationship: imports
    - from: "storage/redis"
      to: types
      relationship: imports
    - from: "interfaces, plugin/sdk.go"
      to: types
      relationship: imports
    - from: "sysrepo, sysmanager"
      to: sysmodel
      relationship: imports
    - from: "registry/nacos"
      to: types
      relationship: imports


