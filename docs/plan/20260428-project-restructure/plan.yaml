plan_id: 20260428-project-restructure
objective: >
  将 distributed-workflow 项目代码从当前扁平结构迁移到 architectural-design.md
  规定的目录结构，保留根目录单 go.mod，移动文件并调整包名/import 路径，
  同步重构 engine 为依赖 interfaces（依赖倒置），将管理路由与触发路由分离。
created_at: "2026-04-28T00:00:00Z"
created_by: gem-planner
status: pending
research_confidence: high

plan_metrics:
  wave_1_task_count: 3
  total_dependencies: 22
  risk_score: high

tldr: |
  迁移分 7 波次执行：
  Wave 1 移动零依赖的底层 types/dag/proto；
  Wave 2 移动并重命名 interfaces → pkg/api；
  Wave 3 迁移存储层（sqlserver/redis）与共享工具（jwtutil/plugin/rpc/registry）；
  Wave 4 迁移 worker 层（worker + executors）；
  Wave 5 重构 engine（移除 sqlserver 直接依赖，改用 interfaces）；
  Wave 6 拆分 endpoint/http 路由（管理路由→config-management handler，触发路由→pkg/endpoint）；
  Wave 7 迁移 sysbuiltin/sysmanager/sysmodel/sysrepo/syssqlserver + 前端 web。
  全部完成后：更新 examples import，验证编译。

open_questions: []

gaps: []

pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: engine.go 中直接 import storage/sqlserver 的依赖移除后，编译报错
      likelihood: high
      impact: critical
      mitigation: >
        Wave 5 任务必须完整扫描 engine/*.go 中所有 sqlserver import，
        全部替换为 interfaces.WorkflowRepository 注入；
        NewRepository 调用只保留在 cmd/engine/main.go 中。
    - scenario: endpoint/http/server.go 中同时持有管理路由和触发路由，拆分后双端编译失败
      likelihood: high
      impact: high
      mitigation: >
        Wave 6 先在新目录创建新 Server 结构体，再从旧 server.go 按路由类型剪切，
        旧目录保留空 doc.go 过渡，最终 Wave 8（清理）删除旧文件。
    - scenario: sysbuiltin 中 package 名为 builtin，迁移后路径变化导致调用方 import 失败
      likelihood: medium
      impact: high
      mitigation: >
        迁移时统一将 package builtin 更名为 service，
        并在任务描述中列出所有调用方（endpoint/http/server_d4.go）一并修改。
    - scenario: go.mod 模块路径不变但文件物理路径变化，IDE/工具链缓存失效
      likelihood: medium
      impact: medium
      mitigation: >
        每波次结束后运行 go build ./... 验证，Wave 完成后提交一次 git checkpoint。
    - scenario: 循环依赖：engine 依赖 interfaces，interfaces 依赖 types；新 pkg/api 同名冲突
      likelihood: medium
      impact: high
      mitigation: >
        interfaces → pkg/api 时 package 名改为 api，确认不与标准库 net/http api 冲突；
        types → 路径变更后统一更新所有 import。
  assumptions:
    - go.mod module 名保持 github.com/zhiyunliu/distributed-workflow 不变
    - gin、grpc、redis、mssqldb 等第三方依赖路径不变
    - 迁移期间不新增业务功能，只做物理搬移 + import 路径修正
    - 每波次结束后执行 go build ./... 验证通过再进入下一波

implementation_specification:
  code_structure: |
    迁移后根目录结构：
    distributed-workflow/
    ├── go.mod                          # 保留，module 名不变
    ├── config-management/
    │   ├── frontend/                   # 原 web/ 整体移动
    │   └── backend/
    │       ├── cmd/api/main.go         # 新建：配置管理服务入口
    │       └── internal/
    │           ├── handler/            # 原 endpoint/http/ 中管理路由文件
    │           │   ├── server.go
    │           │   ├── server_d4.go    # 用户/角色/菜单/权限/认证
    │           │   ├── server_d4_workflow.go
    │           │   ├── server_d5_template.go
    │           │   └── server_d6_*.go (form/approval/oauth/plugin/stats)
    │           ├── service/            # 原 sysbuiltin/（package builtin → service）
    │           └── dao/                # 原 syssqlserver/ + sysrepo/
    ├── runtime-execution/
    │   ├── cmd/
    │   │   ├── engine/main.go          # 新建：Engine 启动入口
    │   │   └── worker/main.go          # 新建：NodeWorker 启动入口
    │   ├── internal/
    │   │   ├── engine/                 # 原 engine/（重构后，移除 sqlserver 直接 import）
    │   │   ├── worker/                 # 原 worker/
    │   │   ├── storage/
    │   │   │   ├── sqlserver/          # 原 storage/sqlserver/
    │   │   │   └── redis/              # 原 storage/redis/
    │   │   ├── common/
    │   │   │   ├── dag/                # 原 dag/
    │   │   │   ├── jwtutil/            # 原 jwtutil/
    │   │   │   ├── plugin/             # 原 plugin/
    │   │   │   ├── rpc/                # 原 rpc/
    │   │   │   └── registry/           # 原 registry/nacos/
    │   │   └── proto/                  # 原 proto/
    │   └── pkg/
    │       ├── api/                    # 原 interfaces/（package api）
    │       ├── node/                   # 原 worker/executors/
    │       ├── endpoint/               # 原 endpoint/http/触发路由 + endpoint/schedule/
    │       └── loader/                 # 新建 WorkflowLoader 实现
    ├── examples/                       # 保留，更新 import
    └── docs/                           # 保留
  affected_areas:
    - 全部 Go 源文件的 import 路径
    - endpoint/http/ 路由拆分（管理 vs 触发）
    - engine/*.go 移除 storage/sqlserver 直接依赖
    - sysbuiltin package 名：builtin → service
    - interfaces package 名：interfaces → api
    - 新增 cmd/api/main.go, cmd/engine/main.go, cmd/worker/main.go 骨架
  component_details:
    - component: types → runtime-execution/internal/proto + runtime-execution/pkg/api（types 保留共享）
      responsibility: 核心类型定义，被 interfaces/engine/storage 引用
      interfaces: [WorkflowDef, WorkflowInstance, WorkflowNodeState]
      dependencies: []
      integration_points: [engine, storage/sqlserver, interfaces]
    - component: interfaces → runtime-execution/pkg/api
      responsibility: 所有可扩展接口定义（依赖倒置核心）
      interfaces: [WorkflowRepository, WorkflowService, SchedulerService, ...]
      dependencies: [types]
      integration_points: [engine, endpoint/http, sysbuiltin]
    - component: engine → runtime-execution/internal/engine
      responsibility: 工作流引擎核心，不再直接依赖 sqlserver
      interfaces: [Engine.New(cfg, WorkflowRepository, RedisRepository)]
      dependencies: [pkg/api, internal/common/rpc, internal/proto]
      integration_points: [cmd/engine/main.go]
    - component: sysbuiltin → config-management/backend/internal/service
      responsibility: 用户/角色/菜单/权限/字典内置实现
      interfaces: [sysmanager.Manager]
      dependencies: [sysmanager, sysrepo, sysmodel]
      integration_points: [config-management/backend/internal/handler]
    - component: endpoint/http(管理路由) → config-management/backend/internal/handler
      responsibility: 系统管理、认证、表单、高级审批等管理端 HTTP 路由
      interfaces: [Server, SetSysManager, SetD6FormService, ...]
      dependencies: [pkg/api, internal/service, sysmanager]
      integration_points: [config-management/backend/cmd/api/main.go]
    - component: endpoint/http(触发路由) → runtime-execution/pkg/endpoint
      responsibility: 工作流触发（D1-D3 核心工作流路由）+ 定时调度端点
      interfaces: [Server.registerRoutes, SetD3Services]
      dependencies: [pkg/api, internal/engine]
      integration_points: [runtime-execution/cmd/engine/main.go]

